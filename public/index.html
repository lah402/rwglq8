      });
    };
    $('#bkCsvOut').onclick = function () {
      download('档案清单-' + nowStr().slice(0, 10) + '.csv', toCSV(db.records), 'text/csv;charset=utf-8');
    };
    $('#bkCsvIn').onclick = function () {
      pickFile('.csv,text/csv', function (text) {
        var rows = parseCSV(text);
        if (rows.length < 2) { toast('CSV 没有数据行', true); return; }
        var idx = {};
        rows[0].forEach(function (h, i) { idx[String(h).trim()] = i; });
        if (idx['名称'] == null) { toast('CSV 需要有「名称」列', true); return; }
        var cell = function (r, n) { var i = idx[n]; return i == null ? '' : String(r[i] || '').trim(); };
        var added = 0;
        rows.slice(1).forEach(function (r) {
          var title = cell(r, '名称');
          if (!title) return;
          var code = cell(r, '编号') || genCode(db.settings.codePrefix, db.records);
          if (db.records.some(function (x) { return x.code === code; })) return;
          createRecord({
            code: code, title: title, category: cell(r, '分类'), status: cell(r, '状态') || db.settings.statuses[0],
            level: cell(r, '密级'), owner: cell(r, '责任人'), location: cell(r, '存放位置'),
            docDate: cell(r, '形成日期'), dueDate: cell(r, '到期/归还日期'),
            tags: cell(r, '标签'), remark: cell(r, '备注'), operator: db.settings.operator || '导入'
          });
          added++;
        });
        renderAll(); closeModal();
        toast('已导入 ' + added + ' 条');
      });
    };
    var cd = $('#bkClearDemo');
    if (cd) cd.onclick = function () {
      var n = db.records.filter(function (r) { return r.demo; }).length;
      confirmDialog('清除示例档案',
        '将删除内置的 <b>' + n + '</b> 条示例档案，你自己录入的档案不受影响。',
        '确认清除',
        function () {
          var snaps = db.records.filter(function (r) { return r.demo; }).map(function (r) {
            return deleteRecord(r.id);
          }).filter(Boolean);
          renderAll(); closeModal();
          toast('已清除 ' + n + ' 条示例档案', false, {
            label: '撤销',
            fn: function () {
              snaps.forEach(function (x) { restoreDeleted(x); });
              toast('已恢复示例档案');
            }
          });
        },
        function () { openBackup(); }
      );
    };
    var dd = $('#bkDedupe');
    if (dd) dd.onclick = function () {
      var n = dedupeNow();
      renderAll(); closeModal();
      if (n > 0) toast('已合并 ' + n + ' 条重复档案');
      else toast('没有发现重复档案');
    };
    $('#bkClear').onclick = function () {
      confirmDialog('清空本机数据',
        '将删除本机的 <b>' + db.records.length + '</b> 条档案和 <b>' + db.logs.length + '</b> 条变更记录。<br>' +
        '建议先导出备份。清空后 7 秒内可撤销。',
        '确认清空',
        function () {
          var snap = { records: db.records.slice(), logs: db.logs.slice(), deleted: db.deleted.slice() };
          db.records = []; db.logs = []; db.deleted = [];
          save(); renderAll(); closeModal();
          toast('已清空本机数据', false, {
            label: '撤销',
            fn: function () {
              db.records = snap.records; db.logs = snap.logs; db.deleted = snap.deleted;
              save(); renderAll(); toast('已恢复 ' + snap.records.length + ' 条档案');
            }
          });
        }
      );
    };
  }

  /* 给「找回 / 导入」回来的档案盖上当前时间戳，让它们比墓碑新。
   * 墓碑过滤的规则是「墓碑时间 >= 档案更新时间 才删除」，
   * 所以只要档案时间比墓碑新，同步时就不会再被墓碑吃掉。
   * 实测：从历史找回 3 条后一同步，云端的墓碑立刻把它们又删光了 ——
   * 因为档案还带着删除前的旧时间戳。不打这枚时间戳，找回等于白找。 */
  function stampRevived(recs) {
    var now = nowStr(), ms = Date.now(), n = 0;
    (recs || []).forEach(function (r) {
      if (!r) return;
      r.updatedAt = now;
      r.revivedAt = ms;
      var fat = r.fat || {};
      FAT_FIELDS.forEach(function (f) { fat[f] = ms; });
      r.fat = fat;
      n++;
    });
    return n;
  }

  /* ---------------- 彻底删除云端 Gist ----------------
   * 「清空云端数据」只改当前内容，GitHub 仍保留历史版本。
   * 要连历史一起抹掉（别人扫到空间地址也找不回），必须删除整个 Gist。 */
  function showDeleteGistHelp() {
    var room = String(db.settings.room || '');
    var gistUrl = 'https://gist.github.com/';
    var html = '';
    html += '<div class="sec-title">要彻底清除，得删掉整个 Gist</div>';
    html += '<p class="hint">程序里的「清空云端数据」只是把内容写成空，' +
      '<b>GitHub 仍然保留历史版本</b>，别人拿到空间地址还能从历史里找回档案。<br>' +
      '要真正抹干净，请按下面三步在网页上删除这个 Gist。</p>';
    html += '<div class="sec-title" style="margin-top:12px">第 1 步：打开你的 Gist 列表</div>';
    html += '<div class="linkbox" style="word-break:break-all;margin:6px 0">' + esc(gistUrl) + '</div>';
    html += '<p class="hint">用<b>创建这个空间的那个 GitHub 账号</b>登录（私有 Gist 只有本人能看到）。</p>';
    html += '<div class="sec-title" style="margin-top:12px">第 2 步：找到它</div>';
    html += '<p class="hint">描述是「<b>档案管理系统 · 云同步数据</b>」，' +
      '里面只有一个文件 <b>archive-sync.json</b>。<br>' +
      (room ? '你的空间编号是：<b>' + esc(room) + '</b>，用它比对网址末尾那段。' : '') + '</p>';
    html += '<div class="sec-title" style="margin-top:12px">第 3 步：删除</div>';
    html += '<p class="hint">进到该 Gist 页面 → 右上角「<b>···</b>」→「<b>Delete</b>」→ 确认。<br>' +
      '删掉后<b>空间地址立即失效</b>，其它设备同步会报 404。</p>';
    html += '<div class="tip" style="background:#fff7ed;border-color:#f0c088;color:#8a5a00;margin:12px 0">' +
      '<b>删之前建议先关掉所有设备的云同步</b>，否则某台设备还开着，' +
      '它会自动新建一个空间或把旧数据推回来，白删一场。</div>';
    html += '<div class="sec-title" style="margin-top:12px">删完之后</div>';
    html += '<p class="hint">· 想<b>重新来过</b>：在「设置」里点「创建云端空间」生成新的，' +
      '再把新地址填到其它设备。<br>' +
      '· 想<b>不用云同步</b>：保持关闭即可，改用「🔗 同步链接」手动传数据。</p>';
    openModal('怎么彻底删除云端数据', html, [
      { text: '关闭', cls: 'btn ghost', fn: closeModal },
      { text: '去关闭云同步', cls: 'btn primary', fn: function () { closeModal(); setTimeout(openSettings, 150); } }
    ]);
  }

  /* ---------------- 同步诊断 ----------------
   * 多台设备互不相通时，最常见的原因是「不在同一个云端空间」。
   * 用户从界面上完全看不出来：两边都显示绿点、都提示"已同步"，
   * 但数据各走各的。这里把关键事实直接摊开，让人一眼能比对。 */
  function openDiag() {
    if (!db.settings.syncOn || !db.settings.room) {
      openModal('同步诊断', '<p class="hint">还没开启云同步，或没填云端空间地址。</p>',
        [{ text: '关闭', cls: 'btn ghost', fn: closeModal },
         { text: '去设置', cls: 'btn primary', fn: function () { closeModal(); setTimeout(openSettings, 150); } }]);
      return;
    }
    openModal('同步诊断', '<p class="hint">正在读取云端…</p>',
      [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);
    var p = provider();
    var localN = syncableRecords().length;
    var localAll = db.records.length;
    var room = String(db.settings.room || '');
    safeCall(function () { return p.read(db.settings.room); })
      .then(function (rem) {
        var d = normaliseRemote(rem);
        d.__files = (rem && rem.__files) || [];
        var cloudRecs = (d.records || []).filter(function (r) { return !r.demo; });
        var cloudN = cloudRecs.length;
        // 本机有、云端没有的
        var cloudId = {}, cloudFp = {};
        cloudRecs.forEach(function (r) { if (r.id) cloudId[r.id] = 1; var f = recFp(r); if (f) cloudFp[f] = 1; });
        var onlyLocal = syncableRecords().filter(function (r) {
          if (r.id && cloudId[r.id]) return false;
          var f = recFp(r); return !(f && cloudFp[f]);
        });
        var locId = {}, locFp = {};
        syncableRecords().forEach(function (r) { if (r.id) locId[r.id] = 1; var f = recFp(r); if (f) locFp[f] = 1; });
        var onlyCloud = cloudRecs.filter(function (r) {
          if (r.id && locId[r.id]) return false;
          var f = recFp(r); return !(f && locFp[f]);
        });

        var html = '';
        html += '<div class="sec-title">关键标识（两台设备必须完全一致）</div>';
        html += '<div class="linkbox" style="word-break:break-all;margin:6px 0">空间地址 / 编号：<br><b>' + esc(room) + '</b></div>';
        html += '<p class="hint">把这一串和另一台设备「设置 → 云端空间地址」里的<b>逐字比对</b>。' +
          '只要有一个字符不同，两台设备就是两个互不相通的空间 —— 这是"都显示已同步但数据不互通"的头号原因。</p>';
        html += '<p class="hint">服务商：<b>' + esc(PROVIDERS[db.settings.provider] ? PROVIDERS[db.settings.provider].label : db.settings.provider) + '</b>' +
          ' · 本机令牌：' + (db.settings.gistToken ? '已填（' + esc(String(db.settings.gistToken).slice(0, 4)) + '••••）' : '<b style="color:#b91c1c">未填</b>') + '</p>';

        html += '<div class="sec-title" style="margin-top:14px">数据对比</div>';
        html += '<p class="hint">本机可同步：<b>' + localN + '</b> 条' +
          (localAll !== localN ? '（另有 ' + (localAll - localN) + ' 条内置示例，不参与同步）' : '') + '</p>';
        html += '<p class="hint">云端实际：<b>' + cloudN + '</b> 条</p>';
        html += '<p class="hint">本机独有（还没传上去）：<b>' + onlyLocal.length + '</b> 条</p>';
        html += '<p class="hint">云端独有（本机还没拉到）：<b>' + onlyCloud.length + '</b> 条</p>';
        /* 数据量是云同步能不能工作的硬门槛，必须在诊断里摆出来。
         * 超过 1 MB 时 GitHub 只返回前 1 MB，读回来的 JSON 是残缺的，
         * 表现就是"明明传上去了、别的设备却拉不到"。 */
        var bRem = 0; try { bRem = byteLen(JSON.stringify(d)); } catch (e) { bRem = 0; }
        var bLoc = 0; try { bLoc = byteLen(JSON.stringify(doc())); } catch (e) { bLoc = 0; }
        /* 「还有设备在用旧版程序」是分片被破坏的头号原因，必须在诊断里点出来。
         * 旧版不认识分片格式，会把它当空云端、再把整包数据写回单文件，
         * 一旦超过 1 MB 就截断，所有设备都读不回来。 */
        var hasShardFile = Object.keys(d.__files || {}).some(function (n) { return /^arc-part-/.test(n); });
        var singleBig = syncState.sawTruncatedSingle;
        html += '<div class="sec-title" style="margin-top:14px">存储格式</div>';
        if (hasShardFile) {
          html += '<p class="hint" style="color:#0e9f6e">✓ 云端使用分片存储（新版格式），大数据可正常同步。</p>';
        } else {
          html += '<p class="hint">云端使用<b>单文件</b>存储' +
            (singleBig ? '，且<span style="color:#b91c1c">已超过 1 MB 被截断</span>' : '') + '。</p>';
          if (singleBig) {
            html += '<div class="tip" style="background:#fef2f2;border-color:#f5b5b5;color:#b91c1c;margin:8px 0">' +
              '<b>✘ 极可能有设备在用旧版程序</b><br>' +
              '新版会自动把大数据拆成多个小文件，不该出现这种「超 1 MB 的单文件」。<br>' +
              '多半是某台设备还跑着旧版：它不认识分片，会把索引当空云端、' +
              '再把自己那份整包写回单个文件，于是分片被清除、数据被截断。<br>' +
              '<b>请把所有设备都更新到最新版程序</b>（每台都打开一次新网址），' +
              '然后在这台点一次「立即同步」重新分片。</div>';
          }
        }

        html += '<div class="sec-title" style="margin-top:14px">数据量（云同步的硬门槛）</div>';
        var capB = SHARD_SIZE * SHARD_MAX_PARTS;
        html += '<p class="hint">云端数据：<b>' + fmtBytes(bRem) + '</b> · 本机数据：<b>' + fmtBytes(bLoc) +
          '</b> / 分片上限约 ' + fmtBytes(capB) + '</p>';
        if (Math.max(bRem, bLoc) > capB) {
          html += '<div class="tip" style="background:#fef2f2;border-color:#f5b5b5;color:#b91c1c;margin:8px 0">' +
            '<b>✘ 已超过分片上限，云同步会失效</b><br>' +
            '数据太大，即使分片也存不下。请压缩图片或删掉不必要的档案图片。</div>';
        } else if (Math.max(bRem, bLoc) > GIST_READ_LIMIT) {
          html += '<div class="tip" style="background:#fffbeb;border-color:#f0c088;color:#8a5a00;margin:8px 0">' +
            '<b>⚠ 已超过 1 MB，正在使用分片存储</b><br>' +
            '程序已自动把数据拆成多个小文件，同步仍可正常工作。' +
            '但数据量偏大会拖慢同步，建议压缩图片。</div>';
        } else if (Math.max(bRem, bLoc) > GIST_WARN_LIMIT) {
          html += '<div class="tip" style="background:#fff7ed;border-color:#f0c088;color:#8a5a00;margin:8px 0">' +
            '<b>⚠ 接近 1 MB 上限</b>，建议现在就压缩图片，否则很快就会同步失效。</div>';
        } else {
          html += '<p class="hint" style="color:#0e9f6e">✓ 数据量正常，在 1 MB 安全线以内。</p>';
        }

        if (cloudN === 0 && localN > 0) {
          html += '<div class="tip" style="background:#fff7ed;border-color:#f0c088;color:#8a5a00;margin:10px 0">' +
            '<b>云端是空的，但本机有 ' + localN + ' 条。</b><br>' +
            '这台设备的数据还没传上去。点下面的按钮立即推送。</div>';
        } else if (onlyLocal.length > 0 || onlyCloud.length > 0) {
          html += '<div class="tip" style="background:#eff6ff;border-color:#93c5fd;color:#1e40af;margin:10px 0">' +
            '两边数据不一致，点下面的按钮合并推送一次。</div>';
        }

        if (onlyCloud.length) {
          html += '<div class="sec-title" style="margin-top:10px">云端有、本机没有（前 8 条）</div>';
          html += '<p class="hint">' + onlyCloud.slice(0, 8).map(function (r) { return esc(r.title || '(无名称)'); }).join('、') + '</p>';
        }
        if (onlyLocal.length) {
          html += '<div class="sec-title" style="margin-top:10px">本机有、云端没有（前 8 条）</div>';
          html += '<p class="hint">' + onlyLocal.slice(0, 8).map(function (r) { return esc(r.title || '(无名称)'); }).join('、') + '</p>';
        }

        var btns = [{ text: '关闭', cls: 'btn ghost', fn: closeModal }];
        if (localN > 0 && (cloudN === 0 || onlyLocal.length > 0)) {
          btns.push({ text: '把本机的 ' + localN + ' 条推上去', cls: 'btn primary', fn: function () {
            closeModal();
            toast('正在推送…');
            syncState.lastPushed = '';
            try { localStorage.removeItem(PUSHED_KEY); } catch (e) {}
            syncState.backoffUntil = 0; syncState.writeFails = 0; syncState.forcePush = true;
            syncNow(false).then(function (ok) {
              if (ok) { renderAll(); setTimeout(openDiag, 400); }
              else toast('推送失败，请看云同步排错', true);
            });
          } });
        }
        btns.push({ text: '重新读取', cls: 'btn', fn: function () { closeModal(); setTimeout(openDiag, 150); } });
        openModal('同步诊断', html, btns);
      })
      .catch(function (e) {
        openModal('读取云端失败',
          '<p class="hint"><b>' + esc(e.message) + '</b></p>' +
          '<p class="hint">如果提示 404：空间地址填错，或这个 Gist 是用<b>别的 GitHub 账号</b>建的' +
          '（私有 Gist 只有创建者能访问）。<br>' +
          '如果提示 401：令牌没填或已失效。</p>',
          [{ text: '关闭', cls: 'btn ghost', fn: closeModal },
           { text: '去设置', cls: 'btn primary', fn: function () { closeModal(); setTimeout(openSettings, 150); } }]);
      });
  }

  /* ---------------- 从云端历史版本找回被删的档案 ----------------
   * 场景：档案被删（尤其是误删、或被新设备同步清掉）后，当前云端里已经没有它了。
   * 但 GitHub 保留了 Gist 的每次修改，删除前的版本里还有这份数据。
   * 这里把历史版本逐个读出来，挑出「本机现在没有、但历史里有」的档案，让用户挑着恢复。 */
  var RECOVER_MAX_VERSIONS = 30;

  function openRecover() {
    var pkey = db.settings.provider;
    if (pkey !== 'gist') { toast('只有 GitHub Gist 有版本历史，其它服务商不保留', true); return; }
    if (!db.settings.syncOn || !db.settings.room) { toast('请先开启云同步并填好空间地址', true); return; }
    var p = PROVIDERS.gist;
    openModal('从云端历史找回', '<p class="hint">正在读取云端的版本历史…</p>',
      [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);

    safeCall(function () { return p.listVersions(db.settings.room, RECOVER_MAX_VERSIONS); })
      .then(function (list) {
        if (!list.length) {
          openModal('从云端历史找回', '<p class="hint">这个空间还没有历史版本（只有一次修改记录）。<br>' +
            '如果档案刚被删，可能删除还没同步上去 —— 可以试试在删除的那台设备上用「撤销」。</p>',
            [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);
          return;
        }
        // 从新到旧逐个读取；每读完一个就更新进度，避免用户干等
        var found = [];       // [{ver, at, records:[...]}]
        var idx = 0;
        function step() {
          if (idx >= list.length) return Promise.resolve();
          var v = list[idx++];
          return safeCall(function () { return p.readVersion(db.settings.room, v.version); })
            .then(function (d) {
              var recs = (d && d.records ? d.records : []).filter(function (r) { return !r.demo; });
              found.push({ ver: v.version, at: v.at, records: recs });
              var el = document.getElementById('recProgress');
              if (el) el.textContent = '已读取 ' + found.length + ' / ' + list.length + ' 个历史版本…';
            })
            .catch(function () { /* 某个版本读失败就跳过，不影响其它 */ })
            .then(step);
        }
        var box = document.getElementById('recBody');
        var prog = document.getElementById('recProgress');
        return step().then(function () { renderRecover(list, found); });
      })
      .catch(function (e) {
        openModal('读取失败', '<p class="hint"><b>' + esc(e.message) + '</b></p>' +
          '<p class="hint">常见原因：令牌没填或已失效、空间地址填错、网络不通。</p>',
          [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);
      });
  }

  function renderRecover(list, found) {
    // 本机已有的身份集合：id + 编号 + 内容指纹
    var haveId = {}, haveCode = {};
    db.records.forEach(function (r) {
      if (r.id) haveId[r.id] = 1;
      if (r.code) haveCode[normKey(r.code)] = 1;
    });
    // 逐版本算出「这一版能找回几条」（相对本机 + 相对更新版本已算过的）
    var seen = {};
    var rows = [];
    found.forEach(function (f) {
      var add = [];
      f.records.forEach(function (r) {
        if (r.demo) return;
        if (r.id && haveId[r.id]) return;
        var key = (r.id || '') + '|' + recFp(r);
        if (seen[key]) return;
        seen[key] = 1;
        add.push(r);
      });
      rows.push({ ver: f.ver, at: f.at, total: f.records.length, add: add });
    });
    var recoverable = rows.filter(function (r) { return r.add.length; });
    var totalAdd = 0;
    rows.forEach(function (r) { totalAdd = Math.max(totalAdd, 0); });
    var allAdd = [];
    recoverable.forEach(function (r) { allAdd = allAdd.concat(r.add); });

    var html = '<p class="hint">GitHub 保留了这个空间的每次修改，共读取 <b>' + found.length +
      '</b> 个历史版本。下面是「本机现在没有、但历史版本里有」的档案。</p>';

    if (!allAdd.length) {
      html += '<div class="tip" style="margin-top:10px">历史版本里没有找到本机缺少的档案。' +
        '可能这些档案从没被同步上云端，或在最早的 ' + RECOVER_MAX_VERSIONS + ' 个版本之前就被删了。</div>' +
        '<p class="hint" style="margin-top:8px">还可以试：在<b>删除的那台设备</b>上看看是否还能「撤销」；' +
        '或用「备份/导出」找找有没有存过 JSON 备份。</p>';
      openModal('从云端历史找回', html, [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);
      return;
    }

    html += '<div class="tip" style="background:#fff7ed;border-color:#f0c088;color:#8a5a00;margin:10px 0">' +
      '共找到 <b>' + allAdd.length + '</b> 条可找回的档案。恢复是<b>合并</b>，不会动你现在已有的档案。</div>';

    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<button class="btn primary" id="recAll">全部恢复这 ' + allAdd.length + ' 条</button></div>';

    html += '<div style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px">';
    recoverable.forEach(function (r, i) {
      var when = r.at ? fmtWhen(r.at) : '未知时间';
      html += '<div style="padding:10px;border-bottom:1px solid var(--line)">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
        '<div><b>' + esc(when) + '</b> · 该版本共 ' + r.total + ' 条 · <span style="color:#b45309">可找回 ' + r.add.length + ' 条</span></div>' +
        '<button class="btn sm" data-rec="' + i + '">恢复这 ' + r.add.length + ' 条</button></div>' +
        '<div style="margin-top:6px;color:#667;font-size:12px">' +
        r.add.slice(0, 6).map(function (x) { return esc(x.title || '(无名称)'); }).join('、') +
        (r.add.length > 6 ? ' 等 ' + r.add.length + ' 条' : '') + '</div></div>';
    });
    html += '</div>';

    openModal('从云端历史找回', html, [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);

    function doRestore(recs) {
      var n = 0;
      var toAdd = recs.filter(function (r) {
        return !(r.id && db.records.some(function (x) { return x.id === r.id; }));
      });
      stampRevived(toAdd);            // 盖时间戳，否则同步时被云端墓碑删掉
      toAdd.forEach(function (r) { db.records.push(r); n++; });
      if (!n) { toast('这些档案本机已经有了'); return; }
      save();
      closeModal();
      renderAll();
      toast('已找回 ' + n + ' 条档案', false, {
        label: '撤销',
        fn: function () {
          db.records = db.records.filter(function (x) { return recs.indexOf(x) < 0; });
          save(); renderAll(); toast('已撤销恢复');
        }
      });
    }
    var ba = document.getElementById('recAll');
    if (ba) ba.onclick = function () { doRestore(allAdd); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-rec]'), function (b) {
      b.onclick = function () { doRestore(recoverable[parseInt(b.getAttribute('data-rec'), 10)].add); };
    });
  }

  function fmtWhen(iso) {
    var t = Date.parse(String(iso || ''));
    if (!t) return '未知时间';
    var d = new Date(t);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function pickFile(accept, cb) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept;
    inp.onchange = function () {
      var f = inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { cb(String(fr.result)); };
      fr.readAsText(f, 'utf-8');
    };
    inp.click();
  }

  function downloadText(filename, text) {
    try {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      return true;
    } catch (e) { return false; }
  }

      '③ 让发码的人用「🔗 同步链接」把数据发给你，导入后再扫。</p>' +
      '<a class="m-back" href="' + esc(pageBaseUrl() || location.href.split('#')[0]) + '">← 打开完整档案库</a></div></div>';
  }

  function renderMobile(id) {
    var r = findRecord(id);
    // 手机端是全屏页面：若详情抽屉还开着，它的遮罩会盖住整个屏幕导致点不动
    // （例如刚撤销删除会自动打开详情），所以进入手机端先关掉抽屉
    closeDrawer();
    closeModal();
    $('#viewList').hidden = true;
    $('#viewMobile').hidden = false;
    if (!r) {
      // 简洁码只带编号，本机没有这条档案时，如果开了云同步就先去云端取一次
      if (cloudReady()) {
        $('#viewMobile').innerHTML = '<div class="m-wrap"><div class="m-card">' +
          '<div class="m-title">正在从云端获取…</div>' +
          '<p class="hint">这个码只带档案编号，正在从云端空间取这条档案，请稍候。</p></div></div>';
        syncNow(true).then(function (ok) {
          var r2 = findRecord(id);
          if (r2) { renderMobile(id); toast('已从云端获取到这条档案'); }
          else renderMobileMissing(id, ok ? '云端空间里也没有这条档案。' : '云端连接失败，没能取到档案。');
        });
        return;
      }
      renderMobileMissing(id, '');
      return;
    }
    $('#viewMobile').innerHTML = '<div class="m-wrap">' +
      '<div class="m-card"><div class="m-title">' + esc(r.title) + '</div>' +
        '<div class="m-code">' + esc(r.code) + (r.category ? ' · ' + esc(r.category) : '') + '</div>' +
        '<div class="m-status" id="mStatus">' + esc(r.status) + '</div>' +
        '<div class="kv" style="margin-top:12px">' +
          kv('责任人', r.owner) + kv('存放位置', r.location) + kv('密级', r.level) +
          kv('到期', r.dueDate) + kv('备注', r.remark) + '</div>' +
        photoPanelHtml(r.photos) + '</div>' +
      '<div class="m-card"><div class="sec-title">更改项目状态</div>' +
        '<div class="m-btns" id="mBtns">' + db.settings.statuses.map(function (s) {
          return '<button data-s="' + esc(s) + '" class="' + (s === r.status ? 'on' : '') + '">' + esc(s) + '</button>';
        }).join('') + '</div>' +
        '<input class="m-note" type="text" id="mOperator" placeholder="操作人（可选）" value="' + esc(db.settings.operator) + '">' +
        '<input class="m-note" type="text" id="mNote" placeholder="备注（可选，如：已归还）">' +
        '<button class="btn primary m-note" id="mSave" style="padding:12px">提交状态更新</button></div>' +
      '<div class="m-card"><div class="sec-title">变更记录</div><ul class="timeline">' +
        logsOf(r.id).slice(0, 10).map(logHtml).join('') + '</ul></div>' +
      '<a class="m-back" href="' + esc(pageBaseUrl() || location.href.split('#')[0]) + '">← 打开完整档案库</a></div>';

    bindPhotoThumbs($('#viewMobile'));

    var picked = r.status;
    $$('#mBtns button').forEach(function (b) {
      b.onclick = function () {
        picked = b.dataset.s;
        $$('#mBtns button').forEach(function (x) { x.classList.toggle('on', x === b); });
      };
    });
    $('#mSave').onclick = function () {
      var op = $('#mOperator').value.trim();
      var note = $('#mNote').value.trim();
      if (picked === r.status && !note) { toast('状态没有变化，请先点选新的状态', true); return; }
      db.settings.operator = op;
      setStatus(r.id, picked, op || '扫码用户', note);
      $('#mStatus').textContent = picked;
      $('#mNote').value = '';
      toast('已更新为「' + picked + '」');
      var ul = $('#viewMobile .timeline');
      if (ul) ul.innerHTML = logsOf(r.id).slice(0, 10).map(logHtml).join('');
      syncNow(true);
    };
  }

  function route() {
    var h = parseHash(location.hash);

    // 扫码打开单条档案（链接里自带这条档案的数据，换台手机也能开）
    if (h.one) {
      var one = unpackOne(h.one);
      if (one && one.record) {
        if (!h.id) h.id = one.record.id;
        var kept = adoptOne(one);
        if (kept) h.id = kept;
        save();
        clearOneHash(h.id);
        renderAll();
        toast('已载入档案「' + (one.record.title || one.record.code) + '」到本地');
      } else {
        clearOneHash(h.id);
      }
    }

    // 收到同步链接：解压 → 合并 → 保存 → 清掉超长 hash
    if (h.data) {
      var payload = unpackPayload(h.data);
      if (payload) {
        var before = db.records.length;
        /* 通过链接/扫码进来的数据同样不能被本机墓碑吃掉。
         * 实测：对方发来 10 条档案，本机因为之前删过东西留有墓碑，
         * 结果合并完 0 条 —— 链接看起来「失效」了。 */
        var merged = mergeDocs(doc(), normaliseRemote({
          app: 'archive', v: 1, updatedAt: payload.updatedAt || 0,
          records: payload.records || [], logs: payload.logs || [], deleted: payload.deleted || []
        }), { ignoreTombstones: true });
        db.records = merged.records;
        db.logs = merged.logs;
        db.deleted = merged.deleted;
        /* 【性能优化】原来对每条导入记录都 filter 全表一次，是 O(n²)。
         * 导入几百条时这里会明显卡顿。改成先建 id 索引再查，O(n)。 */
        (function () {
          var byId = Object.create(null);
          merged.records.forEach(function (x) { if (x && x.id) byId[x.id] = x; });
          stampRevived((payload.records || []).map(function (r) { return r && byId[r.id]; }));
        })();
        if (payload.settings) {
          db.settings.statuses = mergeLists(db.settings.statuses, payload.settings.statuses);
          db.settings.categories = mergeLists(db.settings.categories, payload.settings.categories);
          db.settings.levels = mergeLists(db.settings.levels, payload.settings.levels);
          if (payload.settings.siteUrl && !db.settings.siteUrl) db.settings.siteUrl = payload.settings.siteUrl;
          // 异常提醒与自动清理规则也一起带过来，避免两台设备规则不一致
          var ps = payload.settings;
          if (ps.abnormalDays) db.settings.abnormalDays = ps.abnormalDays;
          if (ps.abnormalExclude) db.settings.abnormalExclude = ps.abnormalExclude;
          if (ps.autoDeleteOn !== undefined) db.settings.autoDeleteOn = !!ps.autoDeleteOn;
          if (ps.autoDeleteDays) db.settings.autoDeleteDays = ps.autoDeleteDays;
          if (ps.autoDeleteExclude) db.settings.autoDeleteExclude = ps.autoDeleteExclude;
          if (ps.photoQuality) db.settings.photoQuality = ps.photoQuality;
        }
        save();
        clearDataHash();
        renderAll();
        var delta = db.records.length - before;
        toast('已同步 ' + db.records.length + ' 条档案' + (delta > 0 ? '（新增 ' + delta + ' 条）' : ''));
      } else {
        clearDataHash();
        toast('同步链接无法解析，可能已损坏或被截断', true);
      }
    }

    // 收尾渲染：等云端同步完成后再做，否则会先渲染出“档案不存在”，
    // 数据下一秒才到，用户看到的是错误信息
    function finishRoute() {
      if (h.id) renderMobile(h.id);
      else { $('#viewMobile').hidden = true; $('#viewList').hidden = false; renderAll(); }
    }

    if (h.room) {
      var isNewRoom = (h.room !== db.settings.room) || !db.settings.syncOn;
      db.settings.room = normalizeRoom(h.room, (h.pv || db.settings.provider || 'gist'));
      db.settings.syncOn = true;
      if (h.prov && PROVIDERS[h.prov]) db.settings.provider = h.prov;
      save();
      // 注意：必须补 catch。否则服务不可达时会产生未捕获的 Promise 异常，
      // 界面却还提示「已加入共享空间」，用户以为成功了其实一条都没同步过来。
      syncNow(true).then(function (ok) {
        // 先渲染页面再弹引导：renderMobile 内部会调 closeModal，
        // 先弹的话引导框会被这行关掉，用户什么都看不到。
        finishRoute();
        if (ok) {
          if (isNewRoom) toast('已加入共享空间 · 同步到 ' + db.records.length + ' 条档案');
        } else if (isNewRoom) {
          setTimeout(function () { joinFailHelp(h.prov || db.settings.provider); }, 150);
        }
      }).catch(function (e) {
        finishRoute();
        if (isNewRoom) setTimeout(function () { joinFailHelp(h.prov || db.settings.provider, e && e.message); }, 150);
      });
    } else {
      finishRoute();
    }
  }

  // 清掉 URL 里的 #d/ 大数据，避免后续误复制、被截断
  function clearOneHash(id) {
    var h = parseHash(location.hash);
    var keep = [];
    var keepId = id || h.id;
    if (keepId) keep.push('m/' + encodeURIComponent(keepId));
    if (h.room) keep.push('r/' + encodeURIComponent(h.room));
    if (h.prov) keep.push('p/' + encodeURIComponent(h.prov));
    var url = location.href.split('#')[0] + (keep.length ? '#' + keep.join('&') : '');
    try { history.replaceState(null, '', url); } catch (e) { location.hash = keep.join('&'); }
  }

  function clearDataHash() {
    var h = parseHash(location.hash);
    var keep = [];
    if (h.id) keep.push('m/' + encodeURIComponent(h.id));
    if (h.room) keep.push('r/' + encodeURIComponent(h.room));
    if (h.prov) keep.push('p/' + encodeURIComponent(h.prov));
    var url = location.href.split('#')[0] + (keep.length ? '#' + keep.join('&') : '');
    try { history.replaceState(null, '', url); } catch (e) { location.hash = keep.join('&'); }
  }

  function syncLinkUrl(opt) {
    opt = opt || {};
    var packed = packPayload({ logs: opt.logs !== false });
    if (!packed) return null;
    var base = pageBaseUrl();
    var url = base ? (base + '#d/' + packed) : packed;   // 没有可用网址时只给数据串，提示用户粘贴
    return {
      url: url, packed: packed, base: base,
      len: url.length, bytes: byteLen(url),
      qrOk: byteLen(url) <= 2953
    };
  }

  /* ---------------- 启动 ---------------- */
  function init() {
    load();
    // 只有“全新设备 + 没有外部数据要导入”时才写入示例，避免换设备同步时混入示例
    var h0 = parseHash(location.hash);
    var hasIncoming = !!(h0.data || h0.room);
    // 只在“这台设备从没用过”时才放示例。否则删光档案后一刷新，示例又会冒出来，看起来像删不掉
    if (db.isNewDevice && !hasIncoming) {
      // 示例档案必须用“当前的默认状态/分类”，否则换了默认配置后，
      // 示例的状态不在列表里，筛选下拉找不到、还会被误判成需要保留的旧值
      var pick = function (list, i) { return (list && list.length) ? list[Math.min(i, list.length - 1)] : ''; };
      [[pick(db.settings.categories, 0), pick(db.settings.statuses, 0), '内部', '王小明', 'A柜-3层-2号'],
       [pick(db.settings.categories, 1), pick(db.settings.statuses, 2), '秘密', '李雷', 'B柜-1层-5号'],
       [pick(db.settings.categories, 2), pick(db.settings.statuses, 1), '机密', '人事部', '档案室-2号柜']]
      .forEach(function (d, i) {
        var titles = ['示例档案一 · 采购合同', '示例档案二 · 验收报告', '示例档案三 · 人事档案'];
        var r = createRecord({ title: titles[i], category: d[0], status: d[1], level: d[2], owner: d[3], location: d[4], operator: '示例' });
        r.updatedAt = r.createdAt;
        r.demo = true;                       // 标记为示例，可一键清除
      });
      save();
    }

    // 启动时顺手把历史同步留下的重复档案合并掉
    var fixed = 0;
    try { fixed = dedupeNow(); } catch (e) { fixed = 0; }
    if (fixed > 0) {
      renderAll();
      setTimeout(function () { toast('已自动合并 ' + fixed + ' 条重复档案'); }, 600);
    }

    var t;
    $('#kw').oninput = function () {
      clearTimeout(t);
      t = setTimeout(function () { ui.keyword = $('#kw').value; renderList(); }, 220);
    };
    ['#fStatus', '#fCategory', '#fLevel'].forEach(function (sel) {
      $(sel).onchange = function () {
        ui[sel === '#fStatus' ? 'status' : sel === '#fCategory' ? 'category' : 'level'] = $(sel).value;
        renderList();
      };
    });
    $('#fSort').onchange = function () { ui.sort = this.value; renderList(); };
    $('#btnAbnormal').onclick = function () {
      if (ui.abnormal) { exitAbnormal(); return; }
      var n = abnormalList().length;
      if (!n) { toast('目前没有异常档案（状态非「打包」且停滞 ' + abnormalDays() + ' 天及以上会标记异常）'); return; }
      viewAbnormal();
    };
    $('#btnAbnormalExit').onclick = exitAbnormal;
    $('#btnNew').onclick = function () { openForm(null); };
    $('#btnSettings').onclick = openSettings;
    var sb = $('#btnShrinkTop');
    if (sb) sb.onclick = function () { askShrinkPhotos(photoPreset()); };
    refreshShrinkBtn();
    $('#btnHelp').onclick = openHelp;
    $('#btnBackup').onclick = openBackup;
    $('#btnLink').onclick = openLink;
    $('#btnWxHelp').onclick = function () { openHelp('wx'); };
    $('#btnSync').onclick = function () {
      if (!db.settings.syncOn || !db.settings.room) { openSettings(); return; }
      syncNow();
    };
    $('#modalMask').onclick = closeModal;
    $('#drawerMask').onclick = closeDrawer;
    // 兜底：抽屉遮罩用监听方式，防止后续重绘丢事件
    var dm = $('#drawerMask');
    if (dm && dm.addEventListener) dm.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); closeDrawer(); } });
    window.addEventListener('hashchange', route);
    window.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        if (db.settings.syncOn && db.settings.room) syncNow(true);
      } else {
        flushOnLeave();     // 切到后台：微信里点返回、切换 App 都会走到这里
      }
    });
    // 关闭 / 刷新 / 前进后退离开页面
    window.addEventListener('pagehide', flushOnLeave);

    // GitHub Pages 环境自检：文件名不是 index.html 时提醒
    // （GitHub Pages 只把 index.html 当首页，否则访问「/仓库名/」会 404，看起来就是“部署了却打不开”）
    try {
      if (isGitHubPages(String(location.href))) {
        var seg = String(location.href).split('#')[0].split('/').pop() || '';
        if (/\.html?$/i.test(seg) && !/^index\.html?$/i.test(seg)) {
          var tip = 'GitHub Pages 建议把文件名改成 index.html（现在是 ' + seg + '）';
          setTimeout(function () { toast(tip, false, null); }, 1200);
        }
      }
    } catch (e) {}

    // 微信里首次打开，自动弹一次使用引导（只弹一次）
    // 但扫码「加入共享空间」进来时不弹：那一刻可能有更重要的提示要给他看
    // （比如「这台设备还没填令牌」），被引导框盖掉就再也看不到了。
    if (IS_WX && !(h0 && h0.room)) {
      var guided = '';
      try { guided = localStorage.getItem('archive_wx_guide_v1') || ''; } catch (e) {}
      if (guided !== '1') {
        try { localStorage.setItem('archive_wx_guide_v1', '1'); } catch (e) {}
        setTimeout(function () { openHelp('wx'); }, 400);
      }
    }

    loadQuota();
    loadPushed();
    renderQuota();
    route();
    setupAutoTimer();
    if (db.settings.syncOn && db.settings.room) {
      var pending = hasPendingPush();
      if (pending) syncState.dirty = true;
      syncNow(true);
      if (pending) {
        // 上次关页面时改动没发出去，这次打开会补传；说一声让用户放心
        setTimeout(function () {
          toast('上次有改动没同步成功，正在重试补传…（若一直失败请看云同步排错）');
        }, 900);
      }
    }
    // 自动清理：开页面时查一次，之后每小时查一次（长期开着的页面也能到期即清）
    setTimeout(function () { try { runAutoDelete(); } catch (e) {} }, 1200);
    setInterval(function () { try { runAutoDelete(); } catch (e) {} }, 3600000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();


</script>
