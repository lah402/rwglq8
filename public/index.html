  /* 第三方匿名 JSON 存储服务经常抽风（500/403），
   * 这里把状态码翻译成人能看懂的话，并直接给出替代方案。 */
  function svcErr(name, status) {
    var n = name === 'npoint' ? 'npoint.io' : 'jsonblob.com';
    if (status === 500 || status === 502 || status === 503) {
      return n + ' 服务器出错（HTTP ' + status + '），这是对方服务的问题，不是你的操作有误。' +
        '建议把服务商换成「GitHub Gist」，或改用「🔗 同步链接」。';
    }
    if (status === 403) {
      return n + ' 拒绝了请求（HTTP 403），可能是限流或不再对外开放。' +
        '建议把服务商换成「GitHub Gist」。';
    }
    if (status === 404) return n + ' 找不到这个地址（HTTP 404），空间可能已被清理，请重新创建。';
    return n + ' 返回 HTTP ' + status + '。若反复失败，建议换成「GitHub Gist」。';
  }

  function provider() {
    return PROVIDERS[db.settings.provider] || PROVIDERS.jsonblob;
  }

  function normaliseRemote(d) {
    if (!d || typeof d !== 'object') return emptyDoc();
    return {
      app: d.app || 'archive', v: d.v || 1, updatedAt: d.updatedAt || 0,
      records: Array.isArray(d.records) ? d.records : [],
      logs: Array.isArray(d.logs) ? d.logs : [],
      deleted: Array.isArray(d.deleted) ? d.deleted : [],
      settings: (d.settings && typeof d.settings === 'object') ? d.settings : null,
      settingsAt: d.settingsAt || 0
    };
  }

  /* 服务商方法里有些是同步抛错的（比如 Gist 没填令牌时，构造请求头就 throw）。
   * 同步异常不会被 .then/.catch 捕获，会变成未捕获的 Promise 异常：
   * 界面上既没提示、控制台还报错。统一用 safeCall 包一层，让它走正常的失败分支。 */
  function safeCall(fn) {
    return new Promise(function (resolve, reject) {
      try { resolve(fn()); } catch (e) { reject(e); }
    });
  }

  function syncNow(silent, isRetry) {
    if (!db.settings.syncOn || !db.settings.room) {
      if (!silent) toast('尚未开启云同步，请先到「设置」里创建云端空间', true);
      return Promise.resolve(false);
    }
    if (syncState.busy) return Promise.resolve(false);
    // 撞过限流就别在后台猛刷；用户手动点「立即同步」不受影响
    if (silent && syncState.backoffUntil && syncState.backoffUntil > Date.now()) {
      return Promise.resolve(false);
    }
    // 手动点也要节流：连点「立即同步」是打满额度最常见的人为原因
    if (!silent && syncState.lastAt && Date.now() - syncState.lastAt < 3000) {
      toast('刚同步过，请稍等几秒再试（频繁同步会触发 GitHub 限流）', true);
      return Promise.resolve(false);
    }
    syncState.busy = true;
    setDot(null);
    return safeCall(function () { return provider().read(db.settings.room); })
      .then(function (remote) {
        // 304 = 云端自上次读取以来没变（不消耗额度）。
        // 但本地可能已经改了，仍要判断是否需要推上去——不能就此返回，
        // 否则新建/改状态后正好命中 304，改动就永远推不上云。
        var cloudUnchanged = !!(remote && remote.unchanged);
        var rem = cloudUnchanged
          ? { app: 'archive', v: 1, updatedAt: 0, records: [], logs: [], deleted: [],
              settings: null, settingsAt: 0 }
          : normaliseRemote(remote);
        // 远端设置比本地新就采用：这样一台设备改了配置，其它设备同步后跟着变
        var remoteSetChanged = false;
        if (rem.settings && rem.settingsAt > (db.settings.settingsAt || 0)) {
          remoteSetChanged = applySharedSettings(rem.settings);
          if (remoteSetChanged) db.settings.settingsAt = rem.settingsAt;
        }
        var merged = mergeDocs(doc(), rem);
        /* 示例档案不参与云端交互，但不能因为同步就从本机消失——
         * 否则用户刚打开页面、还没同步完，列表里的示例就凭空没了，
         * 看起来像数据丢失。合并后把它们原样挂回去。 */
        var demoRecs = db.records.filter(function (r) { return r.demo; })
          .filter(function (r) { return !merged.records.some(function (x) { return x.id === r.id; }); });
        db.records = merged.records.concat(demoRecs);
        db.logs = merged.logs;
        db.deleted = merged.deleted;
        save();
        syncState.pendingRemoteSettings = remoteSetChanged;
        // 内容没变化就不写：省掉一半请求（read+write → 只 read），
        // 既减少额度消耗，也降低触发 GitHub 次要速率限制的概率
        var fp = pushFingerprint();
        var prevFp = syncState.lastPushed;
        /* 云端内容的指纹：304 时沿用上次读到的值。
         * 用它判断「合并之后，本地是不是已经和云端一模一样」——
         * 是的话就说明这次同步只是把别人的改动拉下来了，
         * 自己没有任何独有内容要上传，回推一次纯属浪费。 */
        /* 数据量大时同步要花不少时间（主要耗在网络传输上）。
         * 这里把云端数据量显示出来，用户至少知道程序在干活、在传多少，
         * 而不是对着一个转不动的界面以为卡死了。 */
        if (!cloudUnchanged && !silent) {
          var bytes = 0;
          try { bytes = byteLen(JSON.stringify(rem)); } catch (e) { bytes = 0; }
          if (bytes > 300 * 1024) {
            renderSyncing('同步中… ' + fmtBytes(bytes));
          }
        }
        var remoteFp = cloudUnchanged ? syncState.lastRemoteFp
                                      : docFingerprint(rem.records, rem.logs, rem.deleted);
        /* 记住云端实际条数，供「云端是不是空的」判断使用。
         * 原来只看合并后本机新增几条，导致「两边数据一致」被误判成云端空。 */
        if (!cloudUnchanged) syncState.lastRemoteCount = (rem && rem.records) ? rem.records.length : 0;
        syncState.lastRemoteFp = remoteFp;
        if (!cloudUnchanged) {
          syncState.lastCloudN = (rem.records || []).filter(function (r) { return !r.demo; }).length;
        }
        if (remoteFp && fp === remoteFp) {
          savePushed(fp);
          clearDirty();
          /* pulled=true 表示「本地刚被云端更新过」。
           * 不能等同于一无所获的 304 —— 那种情况界面不用重画，
           * 而这种必须 renderAll，否则用户看到的是旧列表，
           * 会以为别人的改动没同步过来。 */
          return { pushed: false, pulled: true, cloudUnchanged: cloudUnchanged };
        }
        /* 本机数据和上次推上云的一致 → 没必要再写一次（省 1 个 PATCH）。
         *
         * 【重要修复】这条短路有个致命前提：云端的内容必须还是我们上次推上去的那份。
         * 一旦云端被清空 / 换了新空间 / 被别的设备覆盖成空，
         * 本机的 fp 没变、lastPushed 还在，于是每次同步都被这里短路 ——
         * 程序报「已同步」，云端却永远是 0 条。用户点「把本机的 N 条传上去」
         * 也会被同样短路，提示"已上传"但实际一个字节都没写。
         * 现在补上两个条件：
         *   ① 云端确实是空的（remoteFp 等于空文档指纹）而本机有数据 → 必须推
         *   ② 短路前确认云端内容 ≈ 上次推送的内容，否则不敢跳
         * 注意用 remoteFp 判断而不是 rem.records.length：
         * 304 时 rem 被构造成空对象（只有 ETag 信息），拿它判断会误判成"云端空"，
         * 导致每轮都强制写入，白白浪费配额。 */
        var EMPTY_FP = docFingerprint([], [], []);
        var remoteIsEmpty = (remoteFp === EMPTY_FP);
        var localHasSyncable = syncableRecords().length > 0 ||
                               (db.logs || []).length > 0 || (db.deleted || []).length > 0;
        var cloudMatchesLastPush = (remoteFp === syncState.lastPushed);
        /* 强制补传要做节流。
         * 「云端空就推」这条修复本身是对的，但如果云端因为某些原因一直空
         * （比如别的设备反复清空、或空间根本不对），就会每 20 秒推一次全量 ——
         * 档案带图片时一次就是几百 KB，手机上表现就是「同步明显变慢」。
         * 推过一次后 5 分钟内不再重复，给用户留出排查时间，也不再空耗流量。 */
        var canForce = Date.now() - (syncState.lastForcePushAt || 0) > 5 * 60 * 1000;
        if (remoteIsEmpty && localHasSyncable && (canForce || syncState.forcePush)) {
          if (!syncState.forcePush) syncState.lastForcePushAt = Date.now();
          /* 云端空、本机有货 —— 强制推，绝不短路 */
        } else if (fp === syncState.lastPushed && (cloudMatchesLastPush || !remoteFp)) {
          return { pushed: false, cloudUnchanged: cloudUnchanged };
        }
        // 先把“有待推送改动”落到本机，再发请求：
        // 万一中途关页面，下次打开也知道要补传
        markDirty();
        /* force：用户明确点了「把本机的 N 条传上去」这类按钮。
         * 此时必须真正写入一次，不能因为指纹看着一样就跳过。 */
        if (syncState.forcePush) syncState.forcePush = false;
        /* 注意：这里刻意不再做一次「写前校验」的额外请求。
         * 之前每次写入前都会多发一个 If-None-Match 请求确认云端有没有变，
         * 但它紧跟在 read 之后，绝大多数情况返回 304 —— 等于白白多花一个
         * 完整网络往返（跨国访问 GitHub 常达 300~800ms），启动同步被拖慢 1/3。
         * 并发正确性由 write 的 If-Match 服务端原子保证负责，冲突时
         * GitHub 返回 412，我们再重新拉取合并重试，既正确又快。 */
        /* 指纹必须等 write 成功后再持久化：
         * 之前是发起请求前就存，一旦 write 失败（断网 / 限流 / 500），
         * 下次打开会误以为“已推送过”而直接跳过，这条改动就永久不同步了。 */
        return safeCall(function () { return provider().write(db.settings.room, doc()); })
          .then(function () {
            savePushed(fp);
            clearDirty();
            syncState.writeFails = 0;
            return { pushed: true, cloudUnchanged: cloudUnchanged };
          })
          .catch(function (e) {
            /* 412 = 写的时候云端已被别的设备改过（If-Match 拦下来了，没造成覆盖）。
             * 重新拉一次云端、合并后重试，这样两边的内容都在。
             * 注意：这里必须在回滚指纹之后，否则重试会因为“已推送过”被跳过。 */
            var msg0 = String((e && e.message) || '');
            // 写入失败且不是并发冲突 → 累计失败次数
            if (!/CONFLICT_412/.test(msg0)) syncState.writeFails = (syncState.writeFails || 0) + 1;
            else syncState.writeFails = 0;
            /* 连续失败 3 次说明多半是永久性问题（数据太大 / 令牌失效 / 空间被删），
             * 再每 20 秒自动重试一次只是白白消耗配额。这里退避 10 分钟，
             * 用户手动点「立即同步」不受影响。 */
            if ((syncState.writeFails || 0) >= 3) {
              syncState.backoffUntil = Date.now() + 10 * 60 * 1000;
              setupAutoTimer();
            }
            if (/CONFLICT_412/.test(msg0) && !isRetry) {
              syncState.lastPushed = prevFp;
              return safeCall(function () { return provider().read(db.settings.room); })
                .then(function (fresh) {
                  var rem3 = normaliseRemote(fresh);
                  var m3 = mergeDocs(doc(), rem3);
                  var d3 = db.records.filter(function (r) { return r.demo; })
                    .filter(function (r) { return !m3.records.some(function (x) { return x.id === r.id; }); });
                  db.records = m3.records.concat(d3); db.logs = m3.logs; db.deleted = m3.deleted;
                  save();
                  syncState.busy = false;
                  return syncNow(silent, true).then(function () { return { retried: true }; });
                })
                .catch(function () { throw e; });
            }
            // 写失败：指纹不变，下次打开才会重试（配合 markDirty 的待推送标记）
            syncState.lastPushed = prevFp;
            throw e;
          });
      })
      .then(function (res) {
        syncState.busy = false;
        syncState.lastAt = Date.now();
        syncState.ok = true;
        if (res && res.pushed === false) {
          // 本次没发写请求，静默结束不打扰用户
          if (syncState.backoffUntil) { syncState.backoffUntil = 0; setupAutoTimer(); }
          setDot(true);
          renderQuota();
          // 拉到了其它设备的改动：界面必须重画，否则列表还是旧的
          if (res.pulled) renderAll();
          return true;
        }
        if (syncState.backoffUntil) { syncState.backoffUntil = 0; setupAutoTimer(); }
        setDot(true);
        renderAll();
        if (syncState.pendingRemoteSettings) {
          syncState.pendingRemoteSettings = false;
          toast('已同步其它设备的设置（状态/分类/清理规则等）');
        }
        if (!silent) {
          var ln = syncableRecords().length;
          var cn = (syncState.lastCloudN == null) ? ln : syncState.lastCloudN;
          /* 明确写出云端条数。原来只报本机条数，用户以为"已同步"就万事大吉，
           * 实际上云端可能一条都没有 —— 正是这次反馈的现象。 */
          toast('已同步 · 本机 ' + ln + ' 条 / 云端 ' + cn + ' 条', false, {
            label: '诊断', fn: function () { setTimeout(openDiag, 100); }
          });
        }
        return true;
      })
      .catch(function (e) {
        syncState.busy = false;
        syncState.ok = false;
        syncState.lastErrorTooBig = /超过 1 MB|太大/.test(String(e && e.message || ''));
        var msg = (e && e.message) || '';
        // 撞上频率限制就退避：把自动同步拉长，否则每 20 秒撞一次墙，
        // 既刷不到数据又持续消耗额度，恢复得更慢
        if (/rate limit|频率限制/i.test(msg)) {
          syncState.backoffUntil = Date.now() + 10 * 60 * 1000;
          setupAutoTimer();
        }
        setDot(false);
        if (!silent) { toast('同步失败：' + msg, true); syncFailHelp(msg, db.settings.provider); }
        return false;
      });
  }

  /* 页面被隐藏 / 关闭时，把还没推上去的改动补发一次。
   * 普通 fetch 在页面卸载时会被中断，keepalive 是浏览器保证送达的通道。 */
  function flushOnLeave() {
    if (!db.settings.syncOn || !db.settings.room) return;
    if (!syncState.dirty) return;
    var p = provider();
    if (!p || !p.writeRaw) return;
    try {
      var ok = p.writeRaw(db.settings.room, doc());
      if (ok) {
        /* 刻意不写指纹：keepalive 拿不到响应，无法确认是否真的成功。
         * 若在这里存指纹，一旦失败就会导致下次打开误判“已推送”而跳过，
         * 改动永久丢失。留着 dirty 标记，下次打开用一次 GET 校验即可。 */
        // 不 clearDirty：同上，下次打开会再校验一次（幂等，不会产生重复档案）。
      }
    } catch (e) {}
  }

  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function setDot(ok) {
    var d = $('#statusDot');
    if (!d) return;
    if (ok === null) { d.style.background = '#d97706'; d.title = '同步中…'; renderSyncing(); return; }
    if (!db.settings.syncOn) { d.style.background = '#98a2b3'; d.title = '未开启云同步'; return; }
    if (ok === false && syncState.backoffUntil && syncState.backoffUntil > Date.now()) {
      d.style.background = '#d97706';
      var m = Math.ceil((syncState.backoffUntil - Date.now()) / 60000);
      d.title = '已触发 GitHub 频率限制，自动同步暂停（约 ' + m + ' 分钟后重试）';
      return;
    }
    d.style.background = ok ? '#0e9f6e' : '#e02424';
    d.title = ok ? ('云同步正常，上次同步 ' + new Date(syncState.lastAt).toLocaleTimeString()) : '云同步失败，点击「云同步」查看';
  }

  function setupAutoTimer() {
    if (syncState.timer) clearInterval(syncState.timer);
    if (syncState.phaseTm) { clearTimeout(syncState.phaseTm); syncState.phaseTm = 0; }
    if (!db.settings.syncOn || !db.settings.room) return;
    var sec = Math.max(10, parseInt(db.settings.autoSync, 10) || 20);
    // 退避期内拉长到 10 分钟一次，等配额恢复
    if (syncState.backoffUntil && syncState.backoffUntil > Date.now()) sec = 600;
    // 错峰：多台设备若同时启动，定时器会在同一秒一起发请求。
    // 给每台设备一个稳定的随机偏移（按区间比例），把请求摊开，
    // 叠加后的瞬时并发降下来，更不容易撞上 GitHub 的限流。
    // 错峰只作用于定时器的相位：首次触发延后「一个周期 + 偏移」。
    // 之前这里额外补了一次 setTimeout 立即同步，和启动时的 syncNow 撞在一起，
    // 变成开页面就连发两轮（最多 4 个请求），纯属浪费。现在只保留周期定时器。
    var jitter = Math.floor((clientHash() % 1000) / 1000 * sec * 1000);
    // 先等「一个周期 + 偏移」再开始，之后按 sec 秒循环。
    // 多台设备因为偏移不同，请求会自然错开，不会挤在同一秒。
    syncState.phaseTm = setTimeout(function () {
      syncNow(true);
      syncState.timer = setInterval(function () { syncNow(true); }, sec * 1000);
    }, sec * 1000 + jitter);
  }

  // 由本机 clientId 派生的稳定随机数（0~999），重启后不变，保证偏移稳定
  function clientHash() {
    var h = 0, str = String(clientId || '') + (navigator.userAgent || '');
    for (var i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) % 100000; }
    return h % 1000;
  }

  /* ---------------- 渲染 ---------------- */
  // 终态判断：只用词表，不能取“列表最后一项”——
  // 升级后旧状态会追加在末尾，取最后一项会把「借出」这类活动状态误判成终态，逾期就不显示了
  var FINAL_WORDS = ['已归档', '已销毁', '已完成', '已完结', '已办结', '已结束', '已归还',
                     '已关闭', '已入库', '归档', '销毁', '打包', '完成', '完结', '结束'];
  function finalsOf(name) {
    if (!name) return false;
    for (var i = 0; i < FINAL_WORDS.length; i++) {
      if (name === FINAL_WORDS[i] || name.indexOf(FINAL_WORDS[i]) >= 0) return true;
    }
    return false;
  }

  /* ---------------- 异常提醒 ----------------
   * 规则：状态不在豁免名单里（默认“打包”这类终态），
   * 且距最后一次更新超过 N 天（默认 2 天）没改过状态 → 标记异常。
   * 用 updatedAt 判断，因为每次状态变更都会刷新它。
   */
  function abnormalDays() {
    var n = parseInt(db.settings.abnormalDays, 10);
    return isNaN(n) || n < 1 ? 2 : n;
  }

  function abnormalExcluded(name) {
    if (!name) return false;
    if (finalsOf(name)) return true;                 // 终态（含“打包”）一律不提醒
    var list = String(db.settings.abnormalExclude || '').split(/[,，、]/)
      .map(function (x) { return x.trim(); }).filter(Boolean);
    for (var i = 0; i < list.length; i++) {
      if (name === list[i] || name.indexOf(list[i]) >= 0) return true;
    }
    return false;
  }

  // 返回停滞天数；正常返回 0
  function staleDays(r) {
    if (!r) return 0;
    var t = Date.parse(String(r.updatedAt || '').replace(' ', 'T'));
    if (!t) t = Date.parse(String(r.createdAt || '').replace(' ', 'T'));
    if (!t) return 0;
    return Math.floor((Date.now() - t) / 86400000);
  }

  // 用「达到」而不是「超过」：阈值 2 天时，卡片上写「停滞 2 天」却没标红会让人困惑
  function isAbnormal(r) {
    if (!r) return false;
    if (abnormalExcluded(r.status)) return false;
    return staleDays(r) >= abnormalDays();
  }

  function abnormalList() {
    return db.records.filter(isAbnormal);
  }

  /* ---------------- 二维码复杂度 ----------------
   * 自带数据的码会把整条档案塞进链接，链接几百到上千字符，
   * 二维码版本升到 7~10+，点数又密又难扫。
   * 开了云同步后根本不需要自带数据——扫码的设备会自动从云端拉这条档案，
   * 所以这时用「只带档案编号」的简洁码，通常只有 40 来字符，码非常稀疏好扫。
   */
  function cloudReady() {
    return !!(db.settings.syncOn && db.settings.room);
  }

  function qrModeOf() {
    var m = db.settings.qrMode || 'auto';
    if (m === 'slim') return 'slim';
    if (m === 'full') return 'full';
    return cloudReady() ? 'slim' : 'full';   // auto：连了云端就用简洁码
  }

  // 二维码版本估算（纠错等级 L）：版本 n 的容量表，用于给用户直观的“密不密”
  var QR_CAP_L = [0,17,32,53,78,106,134,154,192,230,271,321,367,425,458,520,586,644,718,792,858,
                  929,1003,1091,1171,1273,1367,1465,1528,1628,1732,1840,1952,2068,2188,2303,2431,
                  2563,2699,2809,2953];
  function qrVersionOfBytes(n) {
    for (var i = 1; i < QR_CAP_L.length; i++) { if (n <= QR_CAP_L[i]) return i; }
    return -1;                                  // 装不下
  }
  function qrDensity(bytes) {
    var v = qrVersionOfBytes(bytes);
    if (v < 0) return { level: 'over', text: '超出容量', v: -1 };
    if (v <= 4) return { level: 'good', text: '很稀疏，好扫', v: v };
    if (v <= 9) return { level: 'ok', text: '中等，手机可扫', v: v };
    if (v <= 15) return { level: 'dense', text: '较密，建议放大', v: v };
    return { level: 'verydense', text: '很密，建议打印', v: v };
  }

  /* ---------------- 到期自动清理 ----------------
   * 按“创建时间”算：创建满 N 天就自动删除。
   * 默认关闭——这是不可逆操作，必须由用户在设置里主动打开。
   */
  function autoDeleteOn() { return !!db.settings.autoDeleteOn; }

  function autoDeleteDays() {
    var n = parseInt(db.settings.autoDeleteDays, 10);
    return isNaN(n) || n < 1 ? 30 : n;
  }

  // 豁免：设置里指定的状态（默认“打包”这类终态）不自动删
  function autoDeleteExcluded(name) {
    if (!name) return false;
    var list = String(db.settings.autoDeleteExclude || '').split(/[,，、]/)
      .map(function (x) { return x.trim(); }).filter(Boolean);
    for (var i = 0; i < list.length; i++) {
      if (name === list[i] || name.indexOf(list[i]) >= 0) return true;
    }
    return false;
  }

  function createdDaysAgo(r) {
    if (!r) return 0;
    var t = Date.parse(String(r.createdAt || '').replace(' ', 'T'));
    if (!t) return 0;
    return Math.floor((Date.now() - t) / 86400000);
  }

  // 该不该被自动清理（只看创建时间，与“异常提醒”的停滞天数无关）
  function expiredForAutoDelete(r) {
    if (!r) return false;
    if (r.noAutoDel) return false;                 // 撤销过的档案不再自动删
    if (autoDeleteExcluded(r.status)) return false;
    return createdDaysAgo(r) >= autoDeleteDays();
  }

  function autoDeleteCandidates() {
    if (!autoDeleteOn()) return [];
    return db.records.filter(expiredForAutoDelete);
  }

  // 执行一次自动清理。返回被删的记录快照，供撤销用
  function runAutoDelete(opt) {
    opt = opt || {};
    if (!autoDeleteOn()) return null;
    var list = autoDeleteCandidates();
    if (!list.length) return null;
    var snaps = [];
    list.forEach(function (r) {
      var snap = deleteRecord(r.id);
      if (snap) snaps.push(snap);
    });
    if (!snaps.length) return null;
    save();
    renderAll();
    syncNow(true);
    var names = snaps.slice(0, 3).map(function (x) { return x.record.title || x.record.code; }).join('、');
    var more = snaps.length > 3 ? (' 等 ' + snaps.length + ' 条') : '';
    // 30 秒撤销窗口，比普通删除的 7 秒长：自动清理是批量且无人值守的，给足反悔时间
    toast('已自动清理 ' + snaps.length + ' 条到期档案：' + names + more, false, {
      label: '撤销清理',
      fn: function () {
        var n = 0;
        snaps.forEach(function (sp) {
          if (restoreDeleted(sp)) {
            // 标记豁免：否则下次刷新会又被删掉，撤销形同无效
            var rec = findRecord(sp.record.id);
            if (rec) { rec.noAutoDel = true; n++; }
          }
        });
        save();
        renderAll();
        syncNow(true);
        toast('已恢复 ' + n + ' 条，且不再自动清理它们');
      },
      ms: 30000
    });
    return snaps;
  }

  function statusClass(name) {
    var i = db.settings.statuses.indexOf(name);
    return 'badge s' + (i < 0 ? 0 : i % 6);
  }

  function renderStats() {
    var byStatus = {};
    db.records.forEach(function (r) { byStatus[r.status || '未分类'] = (byStatus[r.status || '未分类'] || 0) + 1; });
    var today = nowStr().slice(0, 10);
    var todayChanges = db.logs.filter(function (l) { return String(l.at).slice(0, 10) === today; }).length;
    var overdue = db.records.filter(function (r) {
      return r.dueDate && !finalsOf(r.status) && r.dueDate < today;
    }).length;
    var abnormal = abnormalList().length;
    var html = [
      { n: db.records.length, t: '档案总数' },
      { n: db.logs.length, t: '状态变更' },
      { n: todayChanges, t: '今日变更' },
      { n: overdue, t: '逾期未处理' }
    ].map(function (c) { return '<div class="stat"><b>' + c.n + '</b><span>' + c.t + '</span></div>'; }).join('');
    html += Object.keys(byStatus).map(function (k) {
      return '<div class="stat"><b>' + byStatus[k] + '</b><span>' + esc(k) + '</span></div>';
    }).join('');
    // 异常卡放在状态卡之后：有异常时标红可点，点了直接筛出异常档案
    html += '<div class="stat stat-alert' + (abnormal ? ' has' : '') + '" id="statAbnormal" ' +
      'title="状态非「打包」且超过 ' + abnormalDays() + ' 天没更新">' +
      '<b>' + abnormal + '</b><span>⚠ 异常</span>' +
      (abnormal ? '<span class="stat-sub">点击查看</span>' : '') +
      '</div>';
    $('#statsBar').innerHTML = html;

    var sa = $('#statAbnormal');
    if (sa) sa.onclick = function () {
      if (!abnormalList().length) { toast('目前没有异常档案'); return; }
      viewAbnormal();
    };
  }

  /* 一键查看异常：清空其它筛选，只显示异常档案，并在工具栏留出退出入口 */
  function viewAbnormal() {
    ui.abnormal = true;
    ui.keyword = ''; ui.status = ''; ui.category = ''; ui.level = '';
    ui.sort = 'updated';
    $('#kw').value = '';
    $('#fStatus').value = '';
    $('#fCategory').value = '';
    $('#fLevel').value = '';
    $('#fSort').value = 'updated';
    renderList();
    var n = abnormalList().length;
    toast('已筛出 ' + n + ' 条异常档案（停滞 ' + abnormalDays() + ' 天及以上未更新状态）');
    var banner = $('#abnormalBanner');
    if (banner) banner.hidden = false;
  }

  function exitAbnormal() {
    ui.abnormal = false;
    renderList();
    var banner = $('#abnormalBanner');
    if (banner) banner.hidden = true;
  }

  function renderList() {
    var pool = ui.abnormal ? abnormalList() : db.records;
    var list = sortRecords(applyFilter(pool, {
      keyword: ui.keyword, status: ui.status, category: ui.category, level: ui.level
    }), ui.sort);
    $('#gridBody').innerHTML = list.map(function (r) {
      var todayStr = nowStr().slice(0, 10);
    var overdue = r.dueDate && !finalsOf(r.status) && r.dueDate < todayStr;
      var abn = isAbnormal(r);
      return '<tr data-id="' + esc(r.id) + '"' + (abn ? ' class="row-alert"' : '') + '>' +
        '<td data-label="编号"><span class="code">' + esc(r.code) + '</span></td>' +
        '<td data-label="名称"><div class="t-title">' + esc(r.title) +
          (abn ? ' <span class="badge alert" title="超过 ' + abnormalDays() + ' 天没更新状态">⚠ 停滞 ' + staleDays(r) + ' 天</span>' : '') +
        '</div>' +
          (r.tags ? '<div class="t-sub">🏷 ' + esc(r.tags) + '</div>' : '') + '</td>' +
        '<td data-label="分类" class="hide-m">' + esc(r.category || '—') + '</td>' +
        '<td data-label="状态"><span class="' + statusClass(r.status) + '">' + esc(r.status || '—') + '</span></td>' +
        '<td data-label="密级" class="hide-m">' + esc(r.level || '—') + '</td>' +
        '<td data-label="责任人" class="hide-m">' + esc(r.owner || '—') + '</td>' +
        '<td data-label="位置" class="hide-m">' + esc(r.location || '—') + '</td>' +
        '<td data-label="到期" class="hide-m">' + (r.dueDate
          ? '<span class="' + (overdue ? 'badge over' : '') + '">' + esc(r.dueDate) + (overdue ? ' 已逾期' : '') + '</span>'
          : '—') + '</td>' +
        '<td data-label="更新" class="hide-m">' + fmtDate(r.updatedAt) + '</td>' +
      '</tr>';
    }).join('');
    $('#emptyTip').hidden = db.records.length > 0;
    $('#countText').textContent = ui.abnormal
      ? ('异常 ' + list.length + ' 条（共 ' + db.records.length + ' 条档案）')
      : ('共 ' + db.records.length + ' 条' + (list.length !== db.records.length ? '，筛出 ' + list.length + ' 条' : ''));
    refreshAbnormalUI();
    $$('#gridBody tr').forEach(function (tr) {
      tr.onclick = function () { openDetail(tr.dataset.id); };
    });
  }

  function renderFilters() {
    var label = { '#fStatus': '全部状态', '#fCategory': '全部分类', '#fLevel': '全部密级' };
    [['#fStatus', db.settings.statuses, 'status'],
     ['#fCategory', db.settings.categories, 'category'],
     ['#fLevel', db.settings.levels, 'level']].forEach(function (p) {
      var el = $(p[0]);
      var keep = el.value;
      el.innerHTML = '<option value="">' + label[p[0]] + '</option>' +
        p[1].map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('');
      if (keep && p[1].indexOf(keep) >= 0) el.value = keep; else el.value = '';
      ui[p[2]] = el.value;
    });
  }

  function renderWechatBar() {
    var isWx = /MicroMessenger/i.test(navigator.userAgent || '');
    var bar = $('#wxBar');
    if (!bar) return;
    if (!isWx) { bar.hidden = true; return; }
    bar.hidden = false;
    var site = pageBaseUrl();
    $('#wxTip').innerHTML = '你正在<b>微信浏览器</b>里使用。建议点右上角「···」→ 收藏 / 浮窗，下次一点就开；' +
      '也可以「发送给朋友」让同事一起用。' +
      (site ? '' : ' <span style="color:#8a5a00">（当前是本地文件模式，换手机打不开，建议先部署成网址）</span>');
  }

  function renderModeHint() {
    var s = db.settings;
    var site = pageBaseUrl();
    var txt = '单机版 · 数据存在本机浏览器';
    if (s.syncOn && s.room) txt = '☁ 已开启云同步 · 多设备共享';
    else if (site) txt = '🌐 ' + site.replace(/^https?:\/\//, '') + ' · 手机可扫码访问';
    else txt = '⚠️ 本地文件模式 · 换手机打不开，需先部署成网址';
    $('#modeHint').textContent = txt;
    $('#orgName').textContent = s.orgName || '档案管理系统';
    setDot(syncState.ok);
  }

  function refreshAbnormalUI() {
    var n = abnormalList().length;
    var btn = $('#btnAbnormal');
    if (btn) {
      btn.textContent = n ? ('⚠ 查看异常（' + n + '）') : '⚠ 查看异常';
      btn.className = 'btn' + (n ? ' danger-soft' : ' ghost');
    }
    var banner = $('#abnormalBanner');
    if (banner && !banner.hidden) {
      var txt = $('#abnormalBannerText');
      if (txt) txt.textContent = '正在查看异常档案：状态非「打包」且停滞 ' + abnormalDays() + ' 天及以上未更新（共 ' + n + ' 条）';
    }
  }

  function renderAll() {
    renderFilters();
    renderStats();
    renderList();
    refreshAbnormalUI();
    renderModeHint();
    renderWechatBar();
    /* 图片增减后按钮要跟着变（显示张数 / 无图时隐藏）。
     * 用 try 包住：renderAll 在启动很早的阶段就会被调用，
     * 那时 photoStats 依赖的 db 可能还没准备好，不该因此中断渲染。 */
    try { refreshShrinkBtn(); } catch (e) {}
  }

  /* ---------------- 自动清理的确认与预览 ---------------- */
  // 设置里实时显示“打开后会删掉哪些”，避免用户勾完不知道后果
  function renderAutoDeletePreview() {
    var box = $('#autoDelPreview');
    if (!box) return;
    var on = $('#setAutoDelOn') && $('#setAutoDelOn').checked;
    var days = Math.max(1, parseInt(($('#setAutoDelDays') && $('#setAutoDelDays').value) || 30, 10));
    var list = db.records.filter(function (r) {
      if (r.noAutoDel) return false;
      if (autoDeleteExcluded(r.status)) return false;
      return createdDaysAgo(r) >= days;
    });
    if (!on) {
      box.innerHTML = list.length
        ? '<p class="hint" style="color:#0e9f6e">当前关闭中。若打开，会清理 <b>' + list.length + '</b> 条档案。</p>'
        : '<p class="hint">当前关闭中，暂不会清理任何档案。</p>';
      return;
    }
    if (!list.length) {
      box.innerHTML = '<p class="hint" style="color:#0e9f6e">已开启：目前没有到期的档案。</p>';
      return;
    }
    box.innerHTML = '<div class="tip" style="background:#fff1f2;border-color:#f5b5b5;color:#b91c1c">' +
      '<b>⚠ 保存后会立即清理 ' + list.length + ' 条档案</b><br>' +
      list.slice(0, 5).map(function (r) {
        return '· ' + esc(r.title || r.code) + '（' + esc(r.code) + '，已创建 ' + createdDaysAgo(r) + ' 天）';
      }).join('<br>') +
      (list.length > 5 ? '<br>… 等 ' + list.length + ' 条' : '') +
      '<div style="margin-top:8px"><button class="btn sm" id="btnAutoDelNow">立即清理这些</button></div></div>';
    var bn = $('#btnAutoDelNow');
    if (bn) bn.onclick = function () {
      closeModal();
      setTimeout(function () { runAutoDelete(); }, 200);
    };
  }

  function confirmAutoDeleteNow(n) {
    openModal('到期自动清理已开启',
      '<p class="hint">检测到有 <b>' + n + '</b> 条档案已到期（创建满 ' + autoDeleteDays() + ' 天）。' +
      '要现在就清理吗？<br>' +
      '<span style="color:#b45309">清理后其它设备云同步时也会删除；清理提示条上有 30 秒「撤销清理」。</span></p>',
      [
        { text: '暂不清理', cls: 'btn', fn: closeModal },
        { text: '立即清理', cls: 'btn danger', fn: function () { closeModal(); setTimeout(function () { runAutoDelete(); }, 200); } }
      ]);
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(title, bodyHtml, buttons) {
    closeDrawer();          // 弹窗与详情不同时存在，避免互相遮挡
    var m = $('#modal');
    m.innerHTML = '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
      '<button class="x" id="modalX">✕</button></div>' +
      '<div class="modal-body">' + bodyHtml + '</div>' +
      '<div class="modal-foot" id="modalFoot"></div>';
    $('#modalMask').hidden = false;
    m.hidden = false;
    $('#modalX').onclick = closeModal;
    (buttons || []).forEach(function (b) {
      var el = document.createElement('button');
      el.className = b.cls || 'btn';
      el.textContent = b.text;
      el.onclick = b.fn;
      $('#modalFoot').appendChild(el);
    });
    return m;
  }
  function closeModal() {
    var m = $('#modal');
    if (m) { m.hidden = true; m.innerHTML = ''; }
    var mk = $('#modalMask');
    if (mk) mk.hidden = true;
  }

  /* ---------------- 详情 ---------------- */
  function openDetail(id) {
    var r = findRecord(id);
    if (!r) { toast('档案不存在', true); return; }
    ui.current = r;
    renderDetail(r);
    $('#drawer').hidden = false;
    $('#drawerMask').hidden = false;
    try { document.body.classList.add('no-scroll'); } catch (e) {}
  }

  function closeDrawer() {
    var d = $('#drawer');
    var m = $('#drawerMask');
    if (d) { d.hidden = true; d.innerHTML = ''; }
    if (m) m.hidden = true;
    try { document.body.classList.remove('no-scroll'); } catch (e) {}
  }

  // 初始占位说明；真正展示的文案在二维码生成后按实际密度再精确写一次
  function qrDescHtml(mode, noSite, cloud, density) {
    if (noSite) return '';
    return mode === 'slim'
      ? '<b>✅ 简洁码</b>：只存档案编号，非常稀疏好扫。'
      : '<b>自带数据码</b>：码里存着这条档案的完整内容。';
  }

  function renderDetail(r) {
    var siteUrl = pageBaseUrl();
    var noSite = !siteUrl;
    // 二维码模式：连了云端就用只带编号的简洁码（稀疏好扫），否则自带数据保证换机能开
    var mode = (noSite || qrModeOf() === 'slim') ? 'slim' : 'full';
    if (noSite) mode = 'slim';
    var selfUrl = (mode === 'full') ? buildSelfQrUrl(siteUrl, r, { logs: true }) : null;
    var url = selfUrl || buildQrUrl(siteUrl, r.id);
    var urlSelfContained = !!selfUrl;
    var density = qrDensity(byteLen(url));

    $('#drawer').innerHTML =
      '<div class="drawer-head"><div><h3>' + esc(r.title) + '</h3>' +
        '<div><span class="code">' + esc(r.code) + '</span> · <span class="' + statusClass(r.status) + '">' + esc(r.status) + '</span></div>' +
      '</div><button class="x" id="drawerX">✕</button></div>' +
      '<div class="drawer-body">' +
        (isAbnormal(r)
          ? '<div class="tip" style="background:#fff1f2;border-color:#f5b5b5;color:#b91c1c;margin-bottom:14px">' +
            '<b>⚠ 这条档案已停滞 ' + staleDays(r) + ' 天没更新状态</b><br>' +
            '状态「' + esc(r.status || '—') + '」不是终态，且已停滞 ' + abnormalDays() + ' 天及以上没变更。' +
            '建议尽快处理或更新状态。' +
            '<div style="margin-top:8px"><button class="btn sm" id="btnAbnFilter">查看全部异常档案</button></div></div>'
          : '') +
        '<div class="sec"><div class="sec-title">📋 基本信息</div>' +
          '<div class="info-with-photos">' +
            '<div class="kv info-kv">' +
              kv('分类', r.category) + kv('密级', r.level) + kv('责任人', r.owner) + kv('存放位置', r.location) +
              kv('形成日期', r.docDate) + kv('到期/归还', r.dueDate) + kv('标签', r.tags) + kv('备注', r.remark) +
              kv('创建', fmtDate(r.createdAt)) + kv('更新', fmtDate(r.updatedAt)) +
            '</div>' +
            photoPanelHtml(r.photos) +
          '</div>' +
        '</div>' +
        '<div class="sec"><div class="sec-title">📱 项目二维码（手机扫码查看 / 改状态）</div>' +
          '<div class="qr-box"><img class="qr-img" id="qrImg" alt="项目二维码">' +
            '<div class="qr-meta"><div id="qrDesc">' + qrDescHtml(mode, noSite, cloudReady(), density) + '</div>' +
            '<div class="url" id="qrUrl"></div>' +
            '<div class="qr-actions">' +
              (IS_WX ? '' : '<button class="btn sm" id="btnQrPng">下载二维码</button>' +
              '<button class="btn sm" id="btnQrPrint">打印标签</button>') +
              '<button class="btn sm" id="btnQrCopy">复制链接</button>' +
              '<button class="btn sm" id="btnQrMode">🔁 切换码的类型</button>' +
              (IS_WX ? '' : '<button class="btn sm" id="btnPreview">预览手机端</button>') +
            '</div></div></div>' +
          (noSite
            ? '<div class="tip" style="background:#fff4e5;border-color:#f0c088;color:#8a5a00;margin-top:10px">' +
              '<b>⚠️ 这个码扫了打不开页面，因为它不是网址。</b><br>' +
              '你现在是<b>直接双击本地文件</b>打开的，本地文件没有网址，' +
              '别的手机访问不到你电脑上的文件，所以二维码里只能放文字信息（扫出来是一段字，不是页面）。<br>' +
              '<b>要能扫码打开，必须先把它变成一个网址</b>（免费，约 2 分钟，不用装任何软件）。</div>' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">' +
                '<button class="btn primary" id="btnDeployGuide">📖 看怎么免费部署成网址</button>' +
                '<button class="btn" id="btnGoSite">⚙️ 我已经有网址，去填写</button>' +
              '</div>'
            : '') +
        '</div>' +
        '<div class="sec"><div class="sec-title">🔄 更新状态</div>' +
          '<div class="status-btns" id="statusBtns">' +
            db.settings.statuses.map(function (s) {
              return '<button data-s="' + esc(s) + '" class="' + (s === r.status ? 'on' : '') + '">' + esc(s) + '</button>';
            }).join('') + '</div>' +
          '<div class="row2" style="margin-top:10px">' +
            '<div class="field"><label>操作人</label><input type="text" id="opName" value="' + esc(db.settings.operator) + '"></div>' +
            '<div class="field"><label>备注（可选）</label><input type="text" id="opNote" placeholder="如：已交给张三"></div>' +
          '</div>' +
          '<button class="btn primary" id="btnSaveStatus" style="width:100%">保存状态变更</button>' +
        '</div>' +
        '<div class="sec"><div class="sec-title">🕘 变更记录</div><ul class="timeline">' +
          logsOf(r.id).map(logHtml).join('') + '</ul></div>' +
        '<div class="sec" style="display:flex;gap:8px">' +
          '<button class="btn" id="btnEdit">✏️ 编辑档案</button>' +
          '<button class="btn danger" id="btnDelete">🗑 删除档案</button></div>' +
      '</div>' +
      '<div class="drawer-close"><button class="btn" id="btnDrawerClose">✕ 关闭详情</button></div>';
    $('#drawerX').onclick = closeDrawer;
    $('#btnDrawerClose').onclick = closeDrawer;

    var qrText = noSite ? textQr(r) : url;
    var tooLong = false;
    try {
      QRCode.matrix(qrText);
    } catch (e) {
      tooLong = true;
      qrText = textQr(r);
    }
    $('#qrUrl').textContent = qrText;
    try { $('#qrImg').src = QRCode.toDataURL(qrText, { size: 300 }); }
    catch (e2) { $('#qrImg').alt = '生成失败：' + e2.message; }
    if (noSite) {
      $('#qrDesc').innerHTML = '<span style="color:#b45309"><b>当前是纯文字码</b>：扫出来是一段档案信息文字，' +
        '<b>不能打开页面</b>。请先部署成网址（见下方按钮）。</span>';
    } else if (tooLong) {
      $('#qrDesc').innerHTML = '<span style="color:#d97706">网址太长，二维码容量装不下。' +
        '当前二维码放的是档案文字信息。建议在「设置 → 页面部署网址」用更短的网址（或短链）。</span>';
    } else if (urlSelfContained) {
      $('#qrDesc').innerHTML = '<b>自带数据码</b>：码里存着这条档案的完整内容，换台手机扫也能打开。' +
        '<span class="qr-den qr-den-' + density.level + '">密度：' + density.text + '</span>' +
        '<br>档案信息改动后建议<b>重新生成一次</b>，让码里的数据保持最新。' +
        (cloudReady() ? '<br><span style="color:#0e9f6e">已连云端，可点「🔁 切换码的类型」改成更简单的简洁码。</span>' : '') +
        (IS_WX ? '<br>微信里<b>长按这张二维码</b>可「保存图片」或「识别图中二维码」；转发给同事，同事扫码也能打开。' : '');
    } else {
      $('#qrDesc').innerHTML = '<b style="color:#0e7a52">✅ 简洁码</b>：只存档案编号，' +
        '<span class="qr-den qr-den-' + density.level + '">密度：' + density.text + '</span>' +
        '<br>' + (cloudReady()
          ? '已连云端，扫码后<b>自动从云端取这条档案</b>，换任何手机扫都能打开。'
          : '扫码的手机需要已有这份数据才能打开；建议先开云同步，或用「🔗 同步链接」导入。') +
        (IS_WX ? '<br>微信里<b>长按这张二维码</b>可「保存图片」或「识别图中二维码」。' : '');
    }

    var bg = $('#btnDeployGuide');
    if (bg) bg.onclick = function () { closeDrawer(); openHelp('deploy'); };
    var bs = $('#btnGoSite');
    if (bs) bs.onclick = function () { closeDrawer(); openSettings(); };

    // 微信里没有这个按钮（微信不支持下载/打印/新窗口），必须判空，否则 null.onclick 抛异常会中断渲染、导致详情面板打不开
    var abnBtn = $('#btnAbnFilter');
    if (abnBtn) abnBtn.onclick = function () { closeDrawer(); viewAbnormal(); };

    bindPhotoThumbs($('#drawer'));
    var qmBtn = $('#btnQrMode');
    if (qmBtn) qmBtn.onclick = function () {
      var cur = db.settings.qrMode || 'auto';
      var next;
      if (cur === 'auto') next = (qrModeOf() === 'slim') ? 'full' : 'slim';
      else next = (cur === 'slim') ? 'full' : 'auto';
      db.settings.qrMode = next;
      save();
      renderDetail(r);
      var label = { auto: '自动（连云端用简洁码）', slim: '简洁码（只带编号）', full: '自带数据码' }[next];
      toast('已切换为：' + label);
    };

    var pngBtn = $('#btnQrPng');
    if (pngBtn) pngBtn.onclick = function () {
      var a = document.createElement('a');
      a.href = QRCode.toDataURL(qrText, { size: 600 });
      a.download = (r.code || 'archive') + '-二维码.png';
      a.click();
    };
    // 微信里没有这个按钮（微信不支持下载/打印/新窗口），必须判空，否则 null.onclick 抛异常会中断渲染、导致详情面板打不开
    var printBtn = $('#btnQrPrint');
    if (printBtn) printBtn.onclick = function () {
      var w = window.open('', '_blank');
      if (!w) { toast('浏览器拦截了弹窗，请允许后重试', true); return; }
      w.document.write('<html><head><meta charset="utf-8"><title>打印 ' + esc(r.code) + '</title><style>' +
        'body{font-family:sans-serif;text-align:center;padding:18px}' +
        '.code{font-family:monospace;color:#666;margin-top:4px;font-size:13px}' +
        '@media print{.noprint{display:none}}</style></head><body>' +
        '<h3 style="margin:0 0 4px">' + esc(r.title) + '</h3>' +
        '<div class="code">' + esc(r.code) + '</div>' +
        '<div style="margin:10px">' + QRCode.toSVG(qrText, { quiet: 3 }).replace('<svg ', '<svg style="width:240px;height:240px" ') + '</div>' +
        '<div class="code">' + esc(qrText) + '</div>' +
        '<p class="noprint"><button onclick="window.print()">打印</button></p></body></html>');
      w.document.close();
    };
    // 微信里没有这个按钮（微信不支持下载/打印/新窗口），必须判空，否则 null.onclick 抛异常会中断渲染、导致详情面板打不开
    var copyBtnQr = $('#btnQrCopy');
    if (copyBtnQr) copyBtnQr.onclick = function () {
      copyFallback(qrText, noSite ? '已复制档案文字信息（不是网址，扫了打不开页面）'
        : (urlSelfContained ? '链接已复制（自带档案数据，可直接发微信）' : '链接已复制'));
    };
    // 微信里没有这个按钮（微信不支持下载/打印/新窗口），必须判空，否则 null.onclick 抛异常会中断渲染、导致详情面板打不开
    var previewBtn = $('#btnPreview');
    if (previewBtn) previewBtn.onclick = function () {
      var b = pageBaseUrl() || location.href.split('#')[0];
      window.open(b + '#m/' + r.id, '_blank');
    };

    var picked = r.status;
    $$('#statusBtns button').forEach(function (b) {
      b.onclick = function () {
        picked = b.dataset.s;
        $$('#statusBtns button').forEach(function (x) { x.classList.toggle('on', x === b); });
      };
    });
    $('#btnSaveStatus').onclick = function () {
      var noteVal = $('#opNote').value.trim();
      if (picked === r.status && !noteVal) { toast('状态没有变化，请先点选新的状态', true); return; }
      db.settings.operator = $('#opName').value.trim();
      setStatus(r.id, picked, db.settings.operator || '未署名', noteVal);
      toast('状态已更新为「' + picked + '」');
      renderAll();
      renderDetail(findRecord(r.id));
      syncNow(true);
    };
    $('#btnEdit').onclick = function () { openForm(r); };
    $('#btnDelete').onclick = function () {
      var title = r.title || r.code;
      confirmDialog('删除档案',
        '确定删除档案「<b>' + esc(title) + '</b>」（' + esc(r.code) + '）吗？<br>' +
        '删除后本机立即移除；开启云同步时其它设备同步后也会移除。<br>' +
        '<span style="color:#0e9f6e">删除后 7 秒内可以点「撤销」恢复。</span>',
        '确认删除',
        function () {
          var snap = deleteRecord(r.id);
          closeDrawer();
          renderAll();
          syncNow(true);
          if (snap) {
            toast('已删除「' + title + '」', false, {
              label: '撤销',
              fn: function () {
                if (restoreDeleted(snap)) { toast('已恢复「' + title + '」'); openDetail(snap.record.id); }
                else toast('恢复失败：档案已存在', true);
              }
            });
          }
        },
        function () { openDetail(r.id); }   // 取消后回到详情
      );
    };
  }

  function logsOf(rid) {
    return db.logs.filter(function (l) { return l.rid === rid; });
  }
  function logHtml(l) {
    return '<li><div>' + esc(l.from || '—') + ' → <b>' + esc(l.to) + '</b>' +
      (l.operator ? ' · ' + esc(l.operator) : '') + '</div>' +
      '<div class="t-time">' + fmtDate(l.at) + '</div>' +
      (l.note ? '<div class="t-note">备注：' + esc(l.note) + '</div>' : '') + '</li>';
  }
  function kv(k, v) { return '<div class="k">' + esc(k) + '</div><div>' + (v ? esc(v) : '—') + '</div>'; }

  /* ---------------- 新建 / 编辑 ---------------- */
  function openForm(r) {
    r = r || null;
    // 档案当前的值即使不在选项列表里（比如刚换了默认状态），也要出现在下拉中，
    // 否则一保存就被静默改成第一项，档案状态会莫名其妙变掉
    var opts = function (list, cur, always) {
      var arr = (list || []).slice();
      if (always !== false && cur && arr.indexOf(cur) < 0) arr = arr.concat([cur]);
      return arr.map(function (s) {
        return '<option value="' + esc(s) + '"' + (s === cur ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('');
    };
    var v = function (k) { return r ? esc(r[k] || '') : ''; };
    var html =
      '<div class="field"><label>档案名称 *</label><input type="text" id="fTitle" value="' + v('title') + '" placeholder="如：2026年度采购合同"></div>' +
      '<div class="row2"><div class="field"><label>档案编号</label><input type="text" id="fCode" value="' + v('code') + '" placeholder="留空自动生成"></div>' +
      '<div class="field"><label>分类</label><select id="fCate"><option value="">—</option>' + opts(db.settings.categories, r && r.category) + '</select></div></div>' +
      '<div class="row2"><div class="field"><label>当前状态</label><select id="fStatus2">' +
        opts(db.settings.statuses, r ? r.status : db.settings.statuses[0]) + '</select></div>' +
      '<div class="field"><label>密级</label><select id="fLevel2"><option value="">—</option>' + opts(db.settings.levels, r && r.level) + '</select></div></div>' +
      '<div class="row2"><div class="field"><label>责任人</label><input type="text" id="fOwner" value="' + v('owner') + '"></div>' +
      '<div class="field"><label>存放位置</label><input type="text" id="fLocation" value="' + v('location') + '" placeholder="如：A柜-3层-2号"></div></div>' +
      '<div class="row2"><div class="field"><label>形成日期</label><input type="date" id="fDocDate" value="' + v('docDate') + '"></div>' +
      '<div class="field"><label>到期/归还日期</label><input type="date" id="fDue" value="' + v('dueDate') + '"></div></div>' +
      '<div class="field"><label>标签（逗号分隔）</label><input type="text" id="fTags" value="' + v('tags') + '"></div>' +
      '<div class="field"><label>备注</label><textarea id="fRemark" rows="3">' + v('remark') + '</textarea></div>' +
      '<div class="field"><label>📷 档案图片（可选）</label>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">' +
          '<input type="file" id="fPhotoInput" accept="image/*" multiple hidden>' +
          '<button type="button" class="btn sm" id="fPhotoPick">选择图片</button>' +
          '<button type="button" class="btn sm" id="fPhotoClear">全部移除</button>' +
          '<span class="hint" id="fPhotoHint"></span>' +
        '</div>' +
        '<div id="fPhotoBox"></div>' +
        '<p class="hint">图片会压缩后存在本机浏览器里（单张通常 80～200 KB）。' +
        '图片<b>不会</b>放进「同步链接」的二维码里（放不下），但会随<b>云同步</b>和<b>备份导出</b>一起走。</p>' +
      '</div>';

    // 打开表单时，先把已有图片拷进临时数组；取消或关闭不会污染原记录
    formPhotos = (r && Array.isArray(r.photos)) ? r.photos.map(function (p) {
      return { data: p.data, w: p.w, h: p.h, name: p.name || '', size: p.size || 0 };
    }) : [];

    openModal(r ? '编辑档案' : '新建档案', html, [
      { text: '取消', cls: 'btn ghost', fn: closeModal },
      { text: r ? '保存修改' : '创建并生成二维码', cls: 'btn primary', fn: function () {
        var data = {
          title: $('#fTitle').value.trim(), code: $('#fCode').value.trim(),
          category: $('#fCate').value, status: $('#fStatus2').value, level: $('#fLevel2').value,
          owner: $('#fOwner').value.trim(), location: $('#fLocation').value.trim(),
          docDate: $('#fDocDate').value, dueDate: $('#fDue').value,
          tags: $('#fTags').value.trim(), remark: $('#fRemark').value.trim(),
          photos: formPhotos.slice(),
          operator: db.settings.operator || '系统'
        };
        if (!data.title) { toast('请填写档案名称', true); return; }
        if (data.code && db.records.some(function (x) { return x.code === data.code && (!r || x.id !== r.id); })) {
          toast('档案编号已存在：' + data.code, true); return;
        }
        var rec = r ? updateRecord(r.id, data) : createRecord(data);
        if (!rec) return;   // 落盘失败时 save() 已经提示过了
        closeModal();
        renderAll();
        syncNow(true);
        // 编辑已有档案时也要用 openDetail：openModal 会先关掉详情面板，
        // 只调 renderDetail 会“填了内容但面板不显示”，看起来像面板凭空消失
        openDetail(rec.id);
        // 先倒数 3 秒「保存中」，再提示成功（新建顺带说明二维码已生成）
        saveProgress(SAVE_PROGRESS_MS, r ? '\u2713 保存成功' : '\u2713 保存成功，二维码已生成');
      }}
    ]);

    // ---- 图片：选择 / 压缩 / 预览 / 移除（必须在 openModal 之后绑定）----
    function renderFormPhotos() {
      var box = $('#fPhotoBox');
      if (!box) return;
      var hint = $('#fPhotoHint');
      if (hint) {
        hint.textContent = formPhotos.length
          ? ('已选 ' + formPhotos.length + ' / ' + PHOTO_MAX_COUNT + ' 张')
          : ('还没选图片 · 最多 ' + PHOTO_MAX_COUNT + ' 张，会自动压缩');
      }
      if (!formPhotos.length) {
        box.innerHTML = '<p class="hint">还没有图片。点「选择图片」可从手机/电脑里挑，会自动压缩。</p>';
        return;
      }
      box.innerHTML = formPhotos.map(function (p, i) {
        return '<div class="photo-thumb">' +
          '<img loading="lazy" decoding="async" src="' + p.data + '" alt="' + esc(p.name || ('图片' + (i + 1))) + '">' +
          '<button type="button" class="photo-del" data-i="' + i + '" title="移除">✕</button>' +
        '</div>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('.photo-del'), function (btn) {
        btn.onclick = function () {
          var i = parseInt(btn.getAttribute('data-i'), 10);
          formPhotos.splice(i, 1);
          renderFormPhotos();
        };
      });
      Array.prototype.forEach.call(box.querySelectorAll('img'), function (im) {
        im.onclick = function () { openPhotoViewer(im.src); };
      });
    }

    var pick = $('#fPhotoPick');
    if (pick) pick.onclick = function () { var el = $('#fPhotoInput'); if (el) el.click(); };

    var clearAll = $('#fPhotoClear');
    if (clearAll) clearAll.onclick = function () {
      if (!formPhotos.length) return;
      formPhotos = [];
      renderFormPhotos();
      toast('已移除全部图片');
    };

    var input = $('#fPhotoInput');
    if (input) input.onchange = function () {
      var files = Array.prototype.slice.call(this.files || []);
      this.value = '';                       // 允许重复选同一个文件
      if (!files.length) return;
      var room = PHOTO_MAX_COUNT - formPhotos.length;
      if (room <= 0) { toast('最多 ' + PHOTO_MAX_COUNT + ' 张图片', true); return; }
      var use = files.slice(0, room);
      if (files.length > room) toast('最多 ' + PHOTO_MAX_COUNT + ' 张，只取前 ' + room + ' 张', true);
      toast('正在处理 ' + use.length + ' 张图片…');
      var done = 0, failed = 0;
      use.forEach(function (f) {
        compressImage(f).then(function (p) {
          formPhotos.push(p);
          done++;
        }).catch(function (e) {
          failed++;
          toast(e.message || '图片处理失败', true);
        }).then(function () {
          if (done + failed === use.length) {
            renderFormPhotos();
            if (done) toast('已添加 ' + done + ' 张图片');
          }
        });
      });
    };

    renderFormPhotos();
  }

    openModal('设置', html, [

        setupAutoTimer();
        closeModal();
        renderAll();
        /* 静默同步，否则「已同步」提示会把「已保存」冲掉。
         * 但「刚填入/刚改了空间地址」时必须给出结果反馈：

        var roomJustChanged = (s.room !== prevRoom) || (s.syncOn && !prevSyncOn);

    // ---- 部署网址：填入当前地址 / 一键诊断 ----

    if (pickBtn) pickBtn.onclick = function () {
      var cur = String(location.href || '').split('#')[0];

      runDiag();
      toast('已填入当前页面地址，记得点「保存」');
    };
    function runDiag() {
      if (!diagBox) return;
      var res = diagnoseUrl(siteInput.value);
      var icon = { ok: '✓', warn: '⚠', err: '✘' };
      var color = { ok: '#0e9f6e', warn: '#b45309', err: '#e02424' };

        }).join('') +
        (res.url ? '<div style="margin-top:8px;color:#667;font-size:12px;word-break:break-all">规范化后：<b>' + esc(res.url) + '</b></div>' : '') +
        '</div>';

    var chkBtn = $('#btnSiteCheck');
    if (chkBtn) chkBtn.onclick = runDiag;
    if (siteInput) siteInput.onchange = runDiag;
    var dg2 = $('#btnDeployGuide2');
    if (dg2) dg2.onclick = function () { openHelp('deploy'); };
    var ge2 = $('#btnGhErr2');
    if (ge2) ge2.onclick = function () { openHelp('github'); };
    var g404 = $('#btnGh404');
    if (g404) g404.onclick = function () { openHelp('gh404'); };
    // 打开设置时，若已填网址就先自动体检一次
    if (siteInput && siteInput.value.trim()) runDiag();
  }

  /* 设置面板可能被别的弹窗替换掉（比如排查指引弹窗），

  /* ---------------- 同步链接（不依赖任何服务器） ---------------- */

    var isGist = pkey === 'gist';
    var html = '<div class="sec"><div class="sec-title">加入共享空间没成功</div>' +
      '<p class="hint">空间地址已经记下了，但<b>没有拉到数据</b>' +
      (msg ? '：<b>' + esc(msg) + '</b>' : '') + '。</p>' +
      '<div class="sec-title" style="margin-top:12px">原因</div><p class="hint">';
    if (isGist) {
      html += '这个空间用的是 <b>GitHub Gist</b>，需要<b>每台设备各自填一次自己的令牌</b>' +
        '（令牌不能通过链接传递，否则会泄露）。' +
        '你只需在<b>这台设备</b>上生成一个令牌，填进去即可。';
    } else {
      html += '可能是网络不通、服务商临时故障，或页面是本地文件打开（file:// 会被浏览器拦截）。';
    }
    html += '</p>';
    if (isGist) {
      html += '<div class="sec-title" style="margin-top:12px">在这台设备填令牌</div>' +
        '<div class="field"><input type="password" id="joinToken" placeholder="ghp_... 或 github_pat_..." ' +
        'style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px"></div>' +
        '<p class="hint">没有令牌？点下面「怎么拿令牌」看 30 秒生成步骤。' +
        '令牌只存在这台设备，不会发给别人。</p>';
    }
    html += '</div>';

    var btns = [
      { text: '怎么拿令牌', cls: 'btn', fn: function () { openHelp('token'); } }
    ];
    if (isGist) {
      btns.push({ text: '填入并重试', cls: 'btn primary', fn: function () {
        var t = String(($('#joinToken') && $('#joinToken').value) || '').trim();
        if (!t) { toast('请先粘贴令牌', true); return; }
        db.settings.gistToken = t;
        db.settings.provider = 'gist';
        db.settings.syncOn = true;
        save();
        closeModal();
        setTimeout(function () {
          syncNow(false).then(function (ok) {
            if (ok) {
              toast('已加入共享空间 · 同步到 ' + db.records.length + ' 条档案');
              renderAll();
              // 扫码进来的（手机端全屏页）要重新渲染，否则拿不到刚同步来的档案

  // 云同步创建/同步失败时，给一个能直接动手的排错框，而不是只弹一句话
  function syncFailHelp(msg, pkey) {
    var isGist = pkey === 'gist';

    var html = '<div class="sec"><div class="sec-title">云同步没连上</div>' +
      '<p class="hint"><b>报错：</b>' + esc(msg) + '</p>' +
      '<div class="sec-title" style="margin-top:12px">建议这样解决</div><p class="hint">';
    if (isRate) {
      // 频率限制和令牌无关，单独给一套说明，避免用户白折腾令牌
      html += '<div class="tip" style="background:#fff7ed;border-color:#f0c088;color:#8a5a00;margin-bottom:10px">' +
        '<b>这是调用太频繁，不是令牌有问题</b><br>' +
        'GitHub 的额度是 <b>每个账号每小时 5000 次</b>——<b>按账号算，不按令牌</b>。' +
        '也就是说，同一账号下开几个令牌都共享这一份，分开填也<b>不会</b>增加上限。' +
        '程序每次同步最多发 2 个请求，超了通常是下面几种情况：<br>' +
        '· <b>同一个浏览器开了多个标签页</b>（最常见）——每个标签页都在定时同步，用量成倍叠加；<br>' +
        '· 多台设备同时开着，且间隔调得过小；<br>' +
        '· 反复点「立即同步」。<br>' +
        '<b>现在不用改令牌</b>：等额度恢复会自动好。程序已自动把同步间隔放到 10 分钟，避免继续撞墙。<br>' +
        '<b>要根本解决</b>：把「自动同步间隔」调大（见下方建议），或让不同设备用<b>不同的 GitHub 账号</b>。' +
        (quota.resetAt > Date.now()
          ? '<br>预计 <b>' + resetClockText() + '</b> 左右恢复。' : '') +
        '</div>' +
        '· <b>关掉多余的标签页</b>——这是最常见的元凶，一个标签页就是一份用量<br>' +
        '· 到「设置」把<b>自动同步间隔调大</b>：' + recommendIntervalText() + '<br>' +
        '· 急用的话先「🔗 同步链接」手动传，不占用额度<br>' +
        '<span style="color:#b45309">注意：同一账号下多开几个令牌没有用，额度是共用的。</span>';
    } else if (isGist) {
      html += '· 确认令牌已填、且<b>只勾了 gist 权限</b>（点下面按钮看生成步骤）<br>' +
        '· 报 401 = 令牌错或过期；报 403 = 权限没勾或限流<br>' +
        '· 令牌要在这台设备的设置里填一次';
    } else {
      html += '· <b>jsonblob / npoint 是免费匿名服务，报 500 或 403 是对方服务器的问题</b>，不是你操作有误<br>' +
        '· 推荐换成 <b>GitHub Gist</b>（数据在你自己的 GitHub 里，稳定得多）<br>' +
        '· 不换的话，过几分钟再试一次，或改用「🔗 同步链接」';

    html += '</p></div>';
    openModal('云同步排错', html, [
      { text: '关闭', cls: 'btn ghost', fn: function () { closeModal(); setTimeout(openSettings, 150); } },
      (isGist
        ? { text: '怎么拿令牌', cls: 'btn', fn: function () { openHelp('token'); } }
        : { text: '换用 GitHub Gist', cls: 'btn primary', fn: function () {
            closeModal();
            setTimeout(function () {
              openSettings();
              setTimeout(function () {
                var sel = $('#setProvider'); if (sel) { sel.value = 'gist'; sel.onchange && sel.onchange(); }
                var tf = $('#tokenField'); if (tf) tf.hidden = false;
                toast('已切到 GitHub Gist，请先填令牌再创建');
              }, 250);
            }, 150);
          } }),
      { text: '改用同步链接', cls: 'btn', fn: function () { closeModal(); setTimeout(openLink, 200); } }
    ]);
  }

  function openLink() {
    var opt = { logs: true };
    var isWx = /micromessenger/i.test((navigator && navigator.userAgent) || '');

    function build() {
      var r = syncLinkUrl(opt);
      var base = pageBaseUrl();
      var h = r ? linkHealth(r.len, r.bytes) : null;

      var html;
      if (!r) {
        html = '<div class="tip">当前环境无法生成同步链接（压缩模块不可用）。请改用「☁ 云同步」或导出备份文件。</div>';
      } else if (!base) {
        html = '<div class="tip" style="background:#fff4e5;border-color:#f0c088;color:#8a5a00">' +
          '<b>当前页面地址不可用，换设备打不开这条链接。</b><br>' +
          '检测到页面地址是：<b>' + esc(selfUrlDesc()) + '</b>。' +
          '请到「设置 → 页面部署网址」填入本页面的 https 网址（把 HTML 传到免费静态托管后得到），' +
          '再回来生成链接。</div>' +
          '<div style="margin:10px 0"><button class="btn primary" id="lkGoSet">去设置填写网址</button></div>' +
          '<p class="hint">也可以先复制下面的<b>数据串</b>，在另一台设备打开系统后，' +
          '用「备份/导出 → 粘贴同步链接导入」导入（不依赖网址）。</p>' +
          '<textarea class="linkbox" id="linkText" readonly>' + esc(r.packed) + '</textarea>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><button class="btn" id="lkCopy">复制数据串</button></div>';
      } else {
        html = '<div class="tip blue">把当前 <b>' + db.records.length + '</b> 条档案' +
          (opt.logs ? '及变更记录' : '（<b>不含变更记录</b>）') +
          '打包进一条链接。发到微信（文件传输助手 / 自己的群 / 收藏），另一台设备<b>点开这条链接</b>就能自动同步过去。</div>' +
          '<textarea class="linkbox" id="linkText" readonly>' + esc(r.url) + '</textarea>' +
          '<p class="hint ' + h.cls + '">' + h.text + '</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px">' +
            '<button class="btn" id="lkCopy">复制链接</button>' +
            '<button class="btn primary" id="lkQr">生成二维码</button>' +
            '<button class="btn" id="lkSlim">' + (opt.logs ? '精简：去掉变更记录' : '恢复：包含变更记录') + '</button>' +
            '<button class="btn" id="lkOpen">在本机试打开</button>' +
          '</div>' +
          '<div id="lkQrBox"></div>' +
          (isWx
            ? '<div class="tip">你正在微信里打开：微信不支持直接下载文件，' +
              '建议用「复制链接 → 发给自己/收藏」来备份；要点开链接时，在聊天里长按链接选「打开」即可。</div>'
            : '<p class="hint">提示：这条链接里就带着数据，所以<b>不要发到公开群</b>；' +
              '档案很多时链接会变长，可先点「精简：去掉变更记录」，或改用「☁ 云同步」。</p>');
      }
      openModal('同步链接（发到微信即可换设备继续用）', html, [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);
      if (!r) return;

      var ta = $('#linkText');
      var copyBtn = $('#lkCopy');
      if (copyBtn) copyBtn.onclick = function () { copyFallback(r.url, '链接已复制，去微信发给自己或收藏'); };
      var slim = $('#lkSlim');
      if (slim) slim.onclick = function () { opt.logs = !opt.logs; build(); };
      var goSet = $('#lkGoSet');
      if (goSet) goSet.onclick = function () { closeModal(); openSettings(); };
      var openBtn = $('#lkOpen');
      if (openBtn) openBtn.onclick = function () {
        try { window.open(r.url, '_blank'); } catch (e) { toast('浏览器拦截了新窗口，请手动复制链接', true); }
      };
      var qrBtn = $('#lkQr');
      if (qrBtn) qrBtn.onclick = function () { renderLinkQr(r); };
    }

    function renderLinkQr(r) {
      var box = $('#lkQrBox');
      if (!box) return;
      if (!r.qrOk) {
        box.innerHTML = '<p class="hint len-bad">这条链接有 ' + r.bytes + ' 字节，超过二维码上限 2953 字节。' +
          '请先点「精简：去掉变更记录」，或改用「复制链接」发到微信 / 开启云同步。</p>';
        return;
      }
      var size = 0;
      try { size = QRCode.matrix(r.url).length; } catch (e) {
        box.innerHTML = '<p class="hint len-bad">生成失败：' + esc(e.message) + '</p>';
        return;
      }
      var tip = size <= 61 ? '图案简单，手机直接扫即可。'
        : size <= 101 ? '图案中等，建议把屏幕亮度调高、距离 15~20 cm 扫。'
        : '图案较密（' + size + '×' + size + '），建议点「保存二维码」后打印到 A4 纸上再扫，或先用「精简」缩短链接。';
      box.innerHTML = '<div class="qr-box"><img class="qr-img" id="lkQrImg" style="width:260px;height:260px">' +
        '<div class="qr-meta"><div>扫这个码即可打开并同步这份数据。</div>' +
        '<div class="url">' + tip + '</div>' +
        '<div class="qr-actions" style="margin-top:8px">' +
          (IS_WX ? '' : '<button class="btn sm" id="lkQrSave">保存二维码</button>') +
        '</div></div></div>' +
        '<p class="hint">微信里<b>长按二维码</b>可「保存图片」或「识别图中二维码」。</p>';
      try { $('#lkQrImg').src = QRCode.toDataURL(r.url, { size: 720 }); } catch (e) { /* 忽略 */ }
      var save = $('#lkQrSave');
      if (save) save.onclick = function () {
        var a = document.createElement('a');
        a.href = QRCode.toDataURL(r.url, { size: 1200 });
        a.download = '档案同步二维码.png';
        a.click();
      };
    }

    build();
  }

  function fallbackCopy(ta, done) {
    var text = (ta && ta.value != null) ? ta.value : String(ta || '');
    copyText(text).then(function (ok) {
      if (ok && done) done();
      else if (!ok) showCopyBox('请手动复制', text, '自动复制失败，请长按下面文本框 → 全选 → 拷贝。');
    });
  }

  /* ---------------- 备份 / 迁移 / CSV ---------------- */
  function download(name, content, mime) {
    if (IS_WX) {
      // 微信内置浏览器不支持下载文件，改为复制文本
      showCopyBox('内容已生成（请复制）', String(content),
        '微信里无法直接下载文件。请点「复制」，然后粘贴到 Excel / 备忘录 / 微信收藏里保存。');
      return;
    }
    try {
      var blob = new Blob([content], { type: mime || 'application/octet-stream' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    } catch (e) {
      showCopyBox('下载失败，请手动复制', String(content), e.message);
    }
  }

  function openBackup() {
    var html =
      '<p class="hint">不用服务器也能在设备之间搬数据：A 设备导出备份文件 → 微信/邮件发到 B 设备 → B 设备导入。' +
      '导入时可选「合并」（保留两边的新数据）或「覆盖」。</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">' +
      '<button class="btn primary" id="bkLink">🔗 生成同步链接</button>' +
      '<button class="btn" id="bkPaste">粘贴同步链接导入…</button>' +
      '<button class="btn" id="bkExport">导出备份文件（.json）</button>' +
      '<button class="btn" id="bkImport">导入备份文件…</button>' +
      '<button class="btn" id="bkCsvOut">导出 CSV（Excel 可打开）</button>' +
      '<button class="btn" id="bkCsvIn">导入 CSV…</button>' +
      '<button class="btn" id="bkDedupe">🧹 检查并合并重复档案</button>' +
      '<button class="btn danger" id="bkClear">清空本机全部数据</button>' +
      (db.settings.syncOn && db.settings.room
        ? '<button class="btn primary" id="bkDiag">🔍 同步诊断（查多设备为什么不互通）</button>' : '') +
      (photoStats().count ? '<button class="btn" id="bkDedupePhoto" style="margin-top:8px">🧹 清理重复图片</button>' : '') +
      '</div>' +
      (db.settings.provider === 'gist' && db.settings.room
        ? '<button class="btn primary" id="bkRecover">🕐 从云端历史找回被删的档案</button>' : '') +
      '</div>' +
      '<p class="hint">本机档案 ' + db.records.length + ' 条，变更记录 ' + db.logs.length + ' 条。</p>' +
      (db.records.some(function (r) { return r.demo; })
        ? '<div style="margin-top:8px"><button class="btn sm" id="bkClearDemo">清除内置的 3 条示例档案</button></div>' : '');
    openModal('备份 / 迁移', html, [{ text: '关闭', cls: 'btn ghost', fn: closeModal }]);

    $('#bkLink').onclick = function () { closeModal(); openLink(); };
    $('#bkPaste').onclick = function () {
      // 不用 prompt：微信内置浏览器可能拦截弹窗
      openModal('粘贴同步链接',
        '<p class="hint">把收到的同步链接粘贴到下面（只粘 #d/ 后面那串也可以）：</p>' +
        '<textarea class="linkbox" id="pasteText" placeholder="https://…#d/xxxx 或 xxxx 那串字符"></textarea>',
        [{ text: '取消', cls: 'btn ghost', fn: openBackup },
         { text: '导入并合并', cls: 'btn primary', fn: function () {
            var txt = ($('#pasteText') && $('#pasteText').value || '').trim();
            if (!txt) { toast('请先粘贴内容', true); return; }
            var seg = txt.indexOf('#d/') >= 0 ? txt.split('#d/')[1].split('&')[0] : txt;
            var payload = unpackPayload(seg);
            if (!payload) { toast('无法解析，请确认链接完整未被截断', true); return; }
            var beforeN2 = db.records.length;
            var m = mergeDocs(doc(), normaliseRemote({
              app: 'archive', v: 1, updatedAt: payload.updatedAt || 0,
              records: payload.records || [], logs: payload.logs || [], deleted: payload.deleted || []
            }), { ignoreTombstones: true });
            db.records = m.records; db.logs = m.logs; db.deleted = m.deleted;
            stampRevived((payload.records || []).map(function (r) {
              return m.records.filter(function (x) { return x.id === r.id; })[0];
            }));
            var addN2 = db.records.length - beforeN2;
            save(); renderAll(); closeModal();
            toast('导入完成，现有 ' + db.records.length + ' 条档案' +
                  (addN2 > 0 ? '（新增 ' + addN2 + ' 条）' : (addN2 === 0 ? '（没有新增）' : '')));
         }}]);
    };
    var dg = $('#bkDiag');

    /* 这个按钮是备份面板里的，面板 HTML 动态生成，

    var dpp = $('#bkDedupePhoto');

    $('#bkExport').onclick = function () {
      download('档案备份-' + nowStr().slice(0, 10) + '.json', JSON.stringify({
        app: 'archive', v: 1, exportedAt: nowStr(), settings: db.settings,

    $('#bkImport').onclick = function () {
      pickFile('.json,application/json', function (text) {
        var d;
        try { d = JSON.parse(text); } catch (e) { toast('不是有效的备份文件', true); return; }
        var applyImport = function (mode) {
        var beforeN = db.records.length;
        if (mode === 'replace') {
          db.records = d.records || []; db.logs = d.logs || []; db.deleted = d.deleted || [];
          Object.keys(d.settings || {}).forEach(function (k) { db.settings[k] = d.settings[k]; });
        } else {
          var m = mergeDocs(doc(), normaliseRemote(d), { ignoreTombstones: true });
          db.records = m.records; db.logs = m.logs; db.deleted = m.deleted;
          /* 盖时间戳：本机留下的墓碑已在合并时清掉，但云端还有，
           * 不盖章的话下一次云同步又会把刚导入的档案删回去。 */
          stampRevived((d.records || []).map(function (r) {
            return m.records.filter(function (x) { return x.id === r.id; })[0];
          }));
          if (d.settings) {
            db.settings.statuses = mergeLists(db.settings.statuses, d.settings.statuses);
            db.settings.categories = mergeLists(db.settings.categories, d.settings.categories);
            db.settings.levels = mergeLists(db.settings.levels, d.settings.levels);

        }
        var addedN = db.records.length - beforeN;

        toast('导入完成，现有 ' + db.records.length + ' 条档案' +

        var incoming = (d.records || []).length;
        var doReplace = function () {
          confirmDialog('确认覆盖',

            '覆盖导入',
            function () {
              var snap = { records: db.records.slice(), logs: db.logs.slice(), deleted: db.deleted.slice() };
              applyImport('replace');
              toast('已覆盖导入', false, {
                label: '撤销',
                fn: function () {
                  db.records = snap.records; db.logs = snap.logs; db.deleted = snap.deleted;
                  save(); renderAll(); toast('已恢复到导入前');

        confirmDialog('导入备份文件',
          '备份文件里有 <b>' + incoming + '</b> 条档案，本机现有 <b>' + db.records.length + '</b> 条。<br>' +
          '· <b>合并</b>：保留两边的新数据，不会删除任何东西（推荐）<br>' +
          '· <b>覆盖</b>：用备份文件替换本机，本机独有的档案会被移除（可撤销）',
          '合并',
          function () { applyImport('merge'); },
          null,
          '覆盖',
          doReplace
