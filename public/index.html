<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>档案管理系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗂️</text></svg>">
<style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --line: #e4e8f0;
  --text: #101828;
  --muted: #667085;
  --brand: #1f6feb;
  --brand-soft: #e8f1ff;
  --ok: #0e9f6e;
  --warn: #d97706;
  --danger: #e02424;
  --radius: 12px;
  --shadow: 0 6px 24px rgba(16, 24, 40, .08);
}

* { box-sizing: border-box; }

/* hidden 属性必须优先生效：否则 .drawer 的 display:flex 会让它永远关不掉 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
}

button, input, select, textarea { font-family: inherit; font-size: 14px; color: inherit; }

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  /* 横屏时刘海会盖住内容；左右也要避开圆角区域 */
  padding: 12px calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left));
  padding-top: calc(12px + env(safe-area-inset-top));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { font-size: 26px; }
.brand-title { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
.brand-sub { font-size: 12px; color: var(--muted); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-left: 4px; }
.dot.bad { background: var(--danger); }

.btn {
  border: 1px solid var(--line);
  background: #fff;
  padding: 7px 13px;
  border-radius: 9px;
  cursor: pointer;
  transition: .15s;
  white-space: nowrap;
}
.btn:hover { border-color: #c7d2e5; background: #fafbff; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #1a5fd0; }
.btn.ghost { color: var(--text); }
.btn.danger { color: var(--danger); border-color: #f3c3c3; }
.btn.danger:hover { background: #fff5f5; }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- 统计 ---------- */
.stats {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding: 14px 20px 0;
}
.stat {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 10px 16px; min-width: 104px;
}
.stat b { display: block; font-size: 20px; line-height: 1.3; }
.stat span { font-size: 12px; color: var(--muted); }

/* ---------- 工具栏 ---------- */
/* 底部留出 iPhone 横条的安全区，否则最后一行档案会被系统手势条盖住 */
main { padding: 14px calc(20px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
.toolbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px;
}
.search-wrap { flex: 1 1 260px; min-width: 200px; }
#kw {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 9px; background: #fbfcfe;
}
#kw:focus, select:focus, input:focus, textarea:focus {
  outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31, 111, 235, .12);
}
select, input[type=text], input[type=date], textarea {
  border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: #fff;
}
.grow { flex: 1; }
.count { color: var(--muted); font-size: 13px; }

/* ---------- 表格 ---------- */
.table-wrap {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow);
}
.grid { width: 100%; border-collapse: collapse; min-width: 940px; }
.grid th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px;
  padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fafbfe;
  position: sticky; top: 0;
}
.grid td { padding: 11px 12px; border-bottom: 1px solid #f0f2f7; vertical-align: middle; }
.grid tbody tr { cursor: pointer; }
.grid tbody tr:hover { background: #f7faff; }
.grid .t-title { font-weight: 600; }
.grid .t-sub { color: var(--muted); font-size: 12px; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; color: #344054; }

.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: #eef2f7; color: #344054; white-space: nowrap;
}
.badge.s0 { background: #e7f6ef; color: var(--ok); }
.badge.s1 { background: #fff3e0; color: var(--warn); }
.badge.s2 { background: #e8f1ff; color: var(--brand); }
.badge.s3 { background: #f2ecff; color: #7c4dff; }
.badge.s4 { background: #eceff3; color: #475467; }
.badge.s5 { background: #fdeaea; color: var(--danger); }
.badge.over { background: #fdeaea; color: var(--danger); }

.empty { padding: 50px 20px; text-align: center; color: var(--muted); }
.empty-icon { font-size: 40px; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 16px; color: var(--muted); }

/* ---------- 抽屉 ---------- */
.drawer-mask, .modal-mask {
  position: fixed; inset: 0; background: rgba(16, 24, 40, .38); z-index: 40;
  animation: fade .18s ease; cursor: pointer;
}
body.no-scroll { overflow: hidden; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
  background: var(--panel); z-index: 50; overflow: auto;
  box-shadow: -8px 0 30px rgba(16, 24, 40, .16);
  animation: slide .22s ease;
  display: flex; flex-direction: column;
}
@keyframes slide { from { transform: translateX(30px); opacity: .4 } to { transform: none; opacity: 1 } }
.drawer-head {
  position: sticky; top: 0; background: var(--panel); z-index: 2;
  padding: 16px 18px 12px; border-bottom: 1px solid var(--line);
  display: flex; align-items: flex-start; gap: 12px;
}
.drawer-head h3 { margin: 0 0 4px; font-size: 17px; }
.drawer-body { padding: 16px 18px 40px; }
.x {
  margin-left: auto; flex: none; border: 1px solid var(--line); background: #fff;
  width: 34px; height: 34px; line-height: 1; border-radius: 9px;
  font-size: 17px; cursor: pointer; color: var(--muted);
}
.x:hover { border-color: var(--brand); color: var(--brand); }
.drawer-close {
  position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
}
.drawer-close .btn { width: 100%; padding: 11px; font-size: 15px; }

.sec { margin-bottom: 20px; }
.sec-title {
  font-size: 12.5px; font-weight: 700; color: var(--muted);
  letter-spacing: .5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 12px; font-size: 13.5px; }
.kv .k { color: var(--muted); }

.qr-box {
  display: flex; gap: 14px; align-items: center;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; background: #fbfcfe; flex-wrap: wrap;
}
.qr-img { width: 150px; height: 150px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.qr-meta { flex: 1; min-width: 190px; font-size: 13px; color: var(--muted); }
.qr-meta .url { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; color: #344054; }
.qr-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.status-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.status-btns button {
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 7px 14px; cursor: pointer; transition: .15s;
}
.status-btns button:hover { border-color: var(--brand); color: var(--brand); }
.status-btns button.on { background: var(--brand); border-color: var(--brand); color: #fff; }

.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.files { list-style: none; margin: 0; padding: 0; }
.files li {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 9px; margin-bottom: 6px; font-size: 13px;
}
.files .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .fsize { color: var(--muted); font-size: 12px; }

.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 14px 12px; font-size: 13px; }
.timeline li::before {
  content: ''; position: absolute; left: -21px; top: 6px;
  width: 9px; height: 9px; border-radius: 50%; background: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.timeline .t-time { color: var(--muted); font-size: 12px; }
.timeline .t-note { color: #344054; }

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed; z-index: 60; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px)); max-height: 88vh; overflow: auto;
  background: var(--panel); border-radius: 14px; box-shadow: 0 20px 60px rgba(16, 24, 40, .25);
  animation: pop .18s ease;
}
@keyframes pop { from { transform: translate(-50%, -46%); opacity: .5 } to { transform: translate(-50%, -50%); opacity: 1 } }
.modal-head { padding: 16px 18px 8px; display: flex; align-items: center; }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-body { padding: 8px 18px 4px; }
.modal-foot {
  padding: 12px 18px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
}
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
  font-size: 12.5px; background: #fff; cursor: pointer;
}
.chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

/* ---------- 手机端项目页 ---------- */
.m-wrap { max-width: 560px; margin: 0 auto; padding: 6px 14px 40px; }
.m-card {
  background: #fff; border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.m-title { font-size: 19px; font-weight: 700; line-height: 1.4; }
.m-code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--muted); }
.m-status {
  display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 999px;
  background: var(--brand-soft); color: var(--brand); font-weight: 700;
}
.m-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
.m-btns button {
  padding: 14px 8px; font-size: 15px; font-weight: 600; border-radius: 12px;
  border: 1px solid var(--line); background: #fff; cursor: pointer;
}
.m-btns button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.m-note { width: 100%; margin-top: 10px; }
.m-back { display: block; text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }

/* ---------- 提示 ---------- */
.toast .t-msg { flex: 1; }
.toast .t-act {
  flex: none; margin-left: 12px; padding: 4px 12px; border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, .5); background: transparent;
  color: #fff; font-size: 13px; cursor: pointer;
}
.toast .t-act:hover { background: rgba(255, 255, 255, .18); }

.toast {
  position: fixed; left: 50%;
  bottom: calc(30px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #101828; color: #fff; padding: 10px 18px; border-radius: 10px;
  z-index: 90; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
}

/* ---------- 移动端适配 ---------- */
@media (max-width: 720px) {
  /* iOS Safari 会在聚焦 font-size < 16px 的输入框时自动放大整个页面，
   * 松手后也不还原，看起来像"界面坏了"。这里统一提到 16px 规避。 */
  input, select, textarea { font-size: 16px; }
  .topbar { padding: 10px 12px; gap: 8px; }
  .brand-sub { display: none; }
  .top-actions .btn { padding: 6px 10px; font-size: 13px; }
  main { padding: 10px calc(12px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
  .stats { padding: 10px 12px 0; gap: 8px; }
  .stat { flex: 1 1 44%; min-width: 0; padding: 8px 12px; }
  .stat b { font-size: 17px; }
  .table-wrap { border-radius: 10px; }
  .grid { min-width: 0; }
  .grid thead { display: none; }
  .grid, .grid tbody, .grid tr, .grid td { display: block; width: 100%; }
  .grid tr {
    border: 1px solid var(--line); border-radius: 10px; margin: 10px; padding: 10px 12px;
    background: #fff;
  }
  .grid td { border: none; padding: 5px 0; }
  /* 移动端点击目标放大到 44px（iOS 人机界面规范），避免点不中 */
  .top-actions .btn, .toolbar .btn, .toolbar select { min-height: 38px; }
  .grid tr { padding: 12px 14px; }
  .grid td::before {
    content: attr(data-label) '：'; color: var(--muted); font-size: 12px; display: inline-block; min-width: 62px;
  }
  .grid td.hide-m { display: none; }
  .drawer { width: 100vw; }
  .row2, .row3 { grid-template-columns: 1fr; }
}

/* ---------- 微信内提示条 ---------- */
.wxbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px; background: #eaf7ef; border-bottom: 1px solid #bfe3cd;
  color: #067647; font-size: 13px;
}
.wxbar .btn { border-color: #9dd0b3; background: #fff; color: #067647; }
.linkbox {
  width: 100%; min-height: 76px; border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px; font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12px; word-break: break-all; background: #fbfcfe; resize: vertical;
}
.len-ok { color: var(--ok); }
.len-warn { color: var(--warn); }
.len-bad { color: var(--danger); }
.tip {
  background: #fff8e6; border: 1px solid #ffe0a3; color: #8a5a00;
  border-radius: 9px; padding: 8px 11px; font-size: 12.5px; margin: 8px 0;
}
.tip.blue { background: var(--brand-soft); border-color: #c3dcff; color: #1a4fa0; }

/* ---------- 档案图片 ---------- */
/* 基本信息与图片并排：宽屏时图片在右侧，窄屏自动上下堆叠 */
.info-with-photos {
  display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap;
}
.info-kv { flex: 1 1 240px; min-width: 0; }
.photo-panel {
  flex: 0 0 auto; max-width: 100%;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px; background: #fbfcfe;
}
.photo-panel-title {
  font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px;
}
.photo-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
  gap: 8px; max-width: 268px;
}
.photo-thumb {
  position: relative; width: 78px; height: 78px; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--line); background: #fff; cursor: zoom-in; flex: 0 0 auto;
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-thumb .photo-del {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; line-height: 18px;
  border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
  font-size: 12px; cursor: pointer; padding: 0;
}
.photo-thumb .photo-del:hover { background: #e02424; }
#fPhotoBox { margin-top: 4px; }
#fPhotoBox .photo-grid { max-width: none; }
@media (max-width: 520px) {
  .info-with-photos { flex-direction: column; }
  .photo-panel { width: 100%; }
  .photo-grid { max-width: none; }
}

/* ---------- 异常提醒 ---------- */
.stat-alert { cursor: pointer; border-color: var(--line); }
.stat-alert.has {
  border-color: #f5b5b5; background: #fff1f2; cursor: pointer;
}
.stat-alert.has b { color: #b91c1c; }
.stat-alert .stat-sub {
  display: block; font-size: 11px; color: #b91c1c; margin-top: 2px;
}
.badge.alert {
  background: #fff1f2; color: #b91c1c; border: 1px solid #f5b5b5;
  font-size: 11px; padding: 1px 6px; border-radius: 999px; white-space: nowrap;
}
tr.row-alert { background: #fff8f8; }
tr.row-alert:hover { background: #fff1f2 !important; }
.btn.danger-soft {
  background: #fff1f2; color: #b91c1c; border: 1px solid #f5b5b5;
}
.btn.danger-soft:hover { background: #ffe4e6; }
.abnormal-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: #fff1f2; border: 1px solid #f5b5b5; color: #b91c1c;
  border-radius: var(--radius); padding: 10px 14px; margin: 10px 0; font-size: 13px;
}

/* ---------- 二维码密度提示 ---------- */
.qr-den { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; margin-top: 4px; }
.qr-den-good { background: #e7f8f0; color: #0e7a52; border: 1px solid #a7e3c6; }
.qr-den-ok { background: #eef4ff; color: #2a56a8; border: 1px solid #c2d3f5; }
.qr-den-dense { background: #fff4e5; color: #8a5a00; border: 1px solid #f0c088; }
.qr-den-verydense { background: #fff1f2; color: #b91c1c; border: 1px solid #f5b5b5; }
.qr-den-over { background: #fff1f2; color: #b91c1c; border: 1px solid #f5b5b5; }

/* 顶部 GitHub 剩余额度提示 */
.quota-txt{font-size:12px;color:#667085;white-space:nowrap;user-select:none}
.quota-txt.low{color:#b45309}
.quota-txt.out{color:#b91c1c}
.quota-txt b{font-weight:600;color:#101828}

</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand">
    <span class="logo">🗂️</span>
    <div>
      <div class="brand-title" id="orgName">档案管理系统</div>
      <div class="brand-sub" id="modeHint">单机版 · 双击即可使用</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn primary" id="btnNew">＋ 新建档案</button>
    <button class="btn ghost" id="btnLink">🔗 同步链接</button>
    <button class="btn ghost" id="btnSync">☁ 云同步</button>
    <button class="btn ghost" id="btnBackup">备份/导出</button>
    <button class="btn ghost" id="btnShrinkTop" hidden title="按当前清晰度档位重新压缩全部档案里的图片">🗜 压缩图片</button>
    <button class="btn ghost" id="btnSettings">设置</button>
    <button class="btn ghost" id="btnHelp">使用帮助</button>
    <span class="dot" id="statusDot" title="云同步状态"></span>
    <span id="quotaText" class="quota-txt" hidden></span>
  </div>
</header>

<div class="wxbar" id="wxBar" hidden>
  <span id="wxTip">在微信里打开</span>
  <button class="btn sm" id="btnWxHelp">怎么在微信里用？</button>
</div>

<section class="stats" id="statsBar"></section>

<main id="viewList">
  <div class="toolbar">
    <div class="search-wrap">
      <input type="search" id="kw" placeholder="搜索名称 / 编号 / 责任人 / 位置 / 备注…" autocomplete="off">
    </div>
    <select id="fStatus"><option value="">全部状态</option></select>
    <select id="fCategory"><option value="">全部分类</option></select>
    <select id="fLevel"><option value="">全部密级</option></select>
    <select id="fSort">
      <option value="updated">最近更新</option>
      <option value="created">最新创建</option>
      <option value="code">按编号</option>
      <option value="title">按名称</option>
    </select>
    <button class="btn ghost" id="btnAbnormal">⚠ 查看异常</button>
    <span class="grow"></span>
    <span class="count" id="countText"></span>
  </div>
  <div class="abnormal-banner" id="abnormalBanner" hidden>

    r.fat = r.fat || {};
    r.fat[f] = Date.now();
  }

  // 合并两条（实为同一条）档案：逐字段按时间戳取新，空字段用对方补齐
  /* 两条记录的字段级时间戳是否完全一致。
   * 一致就说明没有任何字段在一边被单独改过，可以走合并的快速路径。 */
  function sameFat(a, b) {
    var fa = a && a.fat, fb = b && b.fat;
    if (!fa && !fb) return true;                 // 都是老数据（没有 fat）→ 视为一致
    if (!fa || !fb) return false;                // 一边有一边没有 → 需要完整合并
    for (var i = 0; i < FAT_FIELDS.length; i++) {
      var f = FAT_FIELDS[i];
      var va = fa[f] || 0, vb = fb[f] || 0;
      if (va !== vb) return false;
    }
    return true;
  }

  function mergePair(a, b) {
    var an = tsOf(a), bn = tsOf(b);
    var newer = bn > an ? b : a;
    var older = bn > an ? a : b;
    /* 【快速路径】两边内容完全一致 —— 这是同步里最常见的情况：
     * 绝大多数档案根本没被改动过，合并它们纯属浪费。
     * 原来每条都要走一次 JSON 深拷贝 + 12 个字段逐项比较 + 2~3 次 sigOfRec，
     * 实测 600 条时 mergePair 累计就占 30ms 以上，是「档案多了同步发涩」的主因之一。
     * 这里用浅拷贝直接返回，跳过所有重活。
     * 注意 sigOfRec 已含图片指纹（长度+片段），所以签名相等即代表图片一致。 */
    var aSig0 = sigOfRec(a), bSig0 = sigOfRec(b);
    if (aSig0 === bSig0 && sameFat(a, b)) {
      var keepId = (String(a.id) <= String(b.id)) ? a.id : b.id;
      var keep = (String(a.id) <= String(b.id)) ? a : b;
      var o = Object.assign({}, keep);
      o.photos = (keep.photos || []).slice();
      o.id = keepId;
      o.rev = Math.max(a.rev || 1, b.rev || 1);
      o.fat = keep.fat ? Object.assign({}, keep.fat) : undefined;
      if (!keep.fat) delete o.fat;
      if (a.noAutoDel || b.noAutoDel) o.noAutoDel = true;
      return o;
    }
    var out = JSON.parse(JSON.stringify(newer));
    /* id 取两边中稳定（字典序较小）的那个，而不是"本地优先"。
     * 本地优先时 A 和 B 各自合并会得到不同的 id，于是两边推上去的内容
     * 永远不相等，要多推好几轮才能收敛 —— 每轮都是实打实的 PATCH。
     * 取稳定值后，各设备合并结果一致，收敛更快、推送更少。 */
    out.id = (String(a.id) <= String(b.id)) ? a.id : b.id;
    /* 逐字段比较时间戳：谁的字段改得晚就留谁的。
     * 这样 A 改状态、B 改负责人能同时保住，而不是后写的整条覆盖先写的。 */
    var fat = {};
    FAT_FIELDS.forEach(function (f) {
      var atA = fatOf(a, f), atB = fatOf(b, f);
      var pick = (atB > atA) ? b : a;
      var other = (atB > atA) ? a : b;
      out[f] = (pick[f] === undefined || pick[f] === null || pick[f] === '') ? (other[f] || pick[f]) : pick[f];
      fat[f] = Math.max(atA, atB);
    });
    out.fat = fat;
    // 图片：同步链接里装不下图片，从链接过来的记录 photos 是空的，
    // 不能因此把本机已有的图片清掉。两边都有的按内容去重后合并。
    /* 按稳定标识去重，而不是按完整 base64 ——
     * 否则「同一张图压缩前后」会被当成两张，越同步越多。 */
    out.photos = dedupePhotoList((a.photos || []).concat(b.photos || [])).slice(0, PHOTO_MAX_COUNT);
    // 撤销自动清理打过的豁免标记不能被同步冲掉，否则档案会被反复删
    if (a.noAutoDel || b.noAutoDel) out.noAutoDel = true;
    var ac = Date.parse(String(a.createdAt || '').replace(' ', 'T')) || 0;
    var bc = Date.parse(String(b.createdAt || '').replace(' ', 'T')) || 0;
    out.createdAt = (ac && bc) ? (ac <= bc ? a.createdAt : b.createdAt) : (a.createdAt || b.createdAt);
    var maxFat = 0;
    for (var kf in fat) { if (fat[kf] > maxFat) maxFat = fat[kf]; }
    out.updatedAt = fmtTs(maxFat) || newer.updatedAt || older.updatedAt;
    /* rev 只在“有实质变化”时才递增。
     * 原来无条件 +1，导致本机和云端完全一样的两条记录每同步一次 rev 就涨 1，
     * 数据指纹永远在变 → 每次同步都推一遍 → 白耗 GitHub 配额；
     * 多台设备还会互相把 rev 顶上去，形成无意义的写竞争。
     * 这里用“去掉 rev / updatedAt 的内容签名”判断有没有真变化。 */
    var baseRev = Math.max(a.rev || 1, b.rev || 1);
    var aSig = sigOfRec(a), bSig = sigOfRec(b);
    /* 两边签名完全相等时 out 必然也相等（out 从 a/b 之一拷出），
     * 可以省掉第三次 sigOfRec —— 那是三次里最贵的一个 JSON.stringify。 */
    var oSig = (aSig === bSig) ? aSig : sigOfRec(out);
    out.rev = (aSig === bSig || oSig === aSig || oSig === bSig) ? baseRev : baseRev + 1;
    return out;
  }

  /* 签名缓存：sigOfRec 要走一次 JSON.stringify，而合并时同一条记录会被反复求值
   * （快速路径一次、rev 判定一次）。600 条时就是上千次 stringify。
   * 缓存挂在 WeakMap 上，每次 mergeDocs 开始时重建 —— 保证只在单次合并内有效，
   * 不会因为记录后来被修改而返回过期值。 */
  var SIG_CACHE = (typeof WeakMap !== 'undefined') ? new WeakMap() : null;
  function resetSigCache() { if (SIG_CACHE) SIG_CACHE = new WeakMap(); }

  // 记录的内容签名（用于判断合并是否产生了实质变化）
  // 故意排除 rev / updatedAt：这两个字段会随同步变动，不能算作“内容变了”
  function sigOfRec(r) {
    if (!r) return '';
    if (SIG_CACHE) {
      var c = SIG_CACHE.get(r);
      if (c !== undefined) return c;
    }
    var o = {};
    ['code', 'title', 'category', 'level', 'owner', 'location',
     'docDate', 'dueDate', 'tags', 'remark', 'status', 'createdAt'].forEach(function (f) {
      o[f] = String(r[f] || '');
    });
    o.noAutoDel = r.noAutoDel ? 1 : 0;
    // 图片只取长度和片段做指纹，避免整段 base64 参与比较
    o.p = (r.photos || []).map(function (x) {
      return x && x.data ? (String(x.data).length + ':' + String(x.data).slice(0, 48)) : '';
    }).join('|');
    var sig = JSON.stringify(o);
    if (SIG_CACHE) { try { SIG_CACHE.set(r, sig); } catch (e) {} }
    return sig;
  }

  /* 按身份把重复项合成一条；idMap 记录“被合并掉的 id → 保留的 id”，用于同步修正日志。
   *
   * 【性能优化】原来是 O(n²)：每条新记录都要和已保留的全部记录做 sameIdentity 比较，
   * 而 sameIdentity 里还有 normKey / recFp 等字符串运算。
   * 实测 mergeDocs 耗时：10 条 0.9ms，300 条 23.8ms，600 条 106.5ms —— 明显平方级增长，
   * 这正是「档案多了以后同步发涩」的原因。
   * 现在先用两个哈希索引（id、编号+名称）做 O(1) 命中，
   * 只有两者都缺失时才回退线性扫描；合并后同步更新索引，保证后续仍能命中。 */
  function dedupeList(list) {
    var out = [], idMap = {};
    var byId = Object.create(null);
    var byCt = Object.create(null);

    /* 弱索引：按标题把下标分组。只用于加速第③步的线性回退，
     * 不参与身份判定，所以加不加都不会改变合并结果。 */
    var byTitle = Object.create(null);
    function indexIt(id, code, title, idx) {
      if (id) byId[id] = idx;
      var ck = normKey(code), tk = normKey(title);
      if (ck && tk) byCt[ck + '|' + tk] = idx;
      if (tk) (byTitle[tk] || (byTitle[tk] = [])).push(idx);
    }

    (list || []).forEach(function (r) {
      if (!r) return;
      var idx = -1;
      if (r.id && byId[r.id] != null) idx = byId[r.id];          // ① 同一条档案的不同副本
      if (idx < 0) {
        var ck = normKey(r.code), tk = normKey(r.title);
        if (ck && tk) { var k = ck + '|' + tk; if (byCt[k] != null) idx = byCt[k]; }  // ② 编号+名称
      }
      if (idx < 0) {                                             // ③ 老数据回退线性比对
        /* 【性能优化】原来无条件从 0 扫到末尾，是 O(n²)；
         * 数据量大（很久没同步的设备首次合并几千条）时这里是主要卡顿源。
         * 先用「标题」做一层弱索引把候选缩到同标题的一组，
         * 只对这一组做 sameIdentity —— 绝大多数档案标题不同，候选立刻降到 1~2 条。
         * 索引里没有标题时才退回线性扫描（保证行为不变，不会漏合并）。 */
        var tk2 = normKey(r.title);
        var candIdx = (tk2 && byTitle[tk2]) ? byTitle[tk2] : null;
        if (candIdx) {
          for (var i = 0; i < candIdx.length; i++) {
            var ci = candIdx[i];
            if (sameIdentity(out[ci], r)) { idx = ci; break; }
          }
        } else {
          for (var j = 0; j < out.length; j++) {
            if (sameIdentity(out[j], r)) { idx = j; break; }
          }
        }
      }
      if (idx < 0) {
        out.push(r);
        indexIt(r.id, r.code, r.title, out.length - 1);
        return;
      }
      var prevId = out[idx].id;
      var merged = mergePair(out[idx], r);
      if (r.id && r.id !== merged.id) idMap[r.id] = merged.id;
      if (prevId && prevId !== merged.id) idMap[prevId] = merged.id;
      out[idx] = merged;
      // 合并后 id / 编号 / 名称可能被改写，索引必须跟着更新
      indexIt(merged.id, merged.code, merged.title, idx);
      if (r.id) indexIt(r.id, merged.code, merged.title, idx);
      if (prevId) indexIt(prevId, merged.code, merged.title, idx);
    });
    return { list: out, idMap: idMap };
  }

  function remapLogs(logs, idMap) {
    return (logs || []).map(function (l) {
      if (!l) return l;
      return (l.rid && idMap[l.rid]) ? Object.assign({}, l, { rid: idMap[l.rid] }) : l;
    });
  }

  /* opts.ignoreTombstones —— 导入场景专用。
   * 默认（云同步）要用墓碑，这样「A 删了、B 同步后也删」才成立。
   * 但导入备份 / 同步链接时，用户意图是「把这些数据拿回来」，
   * 此时本机残留的墓碑会把进来的档案整批删掉 ——
   * 实测：备份 10 条、本机 0 条，合并完还是 0 条，一条都导不进来。
   * 删过一次就永远导不回来，这个坑必须堵上。 */
  function mergeDocs(local, remote, opts) {
    resetSigCache();            // 缓存只在本次合并内有效，避免记录改动后返回过期签名
    resetFpCache();
    local = local || emptyDoc();
    remote = remote || emptyDoc();
    var ignoreTomb = !!(opts && opts.ignoreTombstones);

    // 1) 档案：按身份合并，同内容的只留一条
    var d = dedupeList((local.records || []).concat(remote.records || []));
    var out = emptyDoc();
    out.records = d.list;
    var idMap = d.idMap;

    // 2) 墓碑：id 与指纹都参与判定，这样“在另一台设备删掉的”即使 id 不同也会被删掉
    var del = {};
    (local.deleted || []).forEach(function (x) { if (x && x.id) del[x.id] = x; });
    (remote.deleted || []).forEach(function (x) {
      if (!x || !x.id) return;
      if (!del[x.id] || x.at > del[x.id].at) del[x.id] = x;
    });
    var tombIds = {}, tombFps = {};
    Object.keys(del).forEach(function (k) {
      tombIds[k] = del[k];
      if (del[k].fp) tombFps[del[k].fp] = del[k];
    });
    /* 【重要修复】一条墓碑只能删掉一条档案。
     * 原实现里，指纹匹配（tombFps）会把「所有内容指纹相同的档案」一起删掉——
     * 实测：云端 5 条同名同内容的档案，用户只删了 1 条，结果 5 条全没了。
     * 这正是「新设备加入后云端文档被清空」的根因：
     * 批量导入 / 只填名称的档案，recFp 极易相同，删一条就连坐一片。
     * 现在指纹匹配只允许命中一次，用完即从候选里移除。 */
    /* 一个墓碑最多只删一条档案，且无论走哪条匹配路径（id / 指纹）都只算一次。
     * 之前只在指纹分支做了限制，结果同一条墓碑先靠 id 删掉目标、
     * 又靠指纹再删掉另一条内容相同的档案 —— 删 1 条实际删了 2 条。 */
    var usedTomb = {};
    out.records = out.records.filter(function (r) {
      if (ignoreTomb) return true;          // 导入场景：墓碑一概不生效
      var t = tombIds[r.id];
      if (!t && r.id && idMap[r.id]) t = tombIds[idMap[r.id]];
      if (!t) { var fp = recFp(r); if (fp) t = tombFps[fp]; }
      if (!t) return true;
      if (usedTomb[t.id]) return true;      // 这条墓碑已经删过一条了
      var ts = tsOf(r);
      if (!ts) return true;                 // 时间无法解析时保守保留
      if (!(t.at >= ts - 1000)) return true;// 1 秒容差（链接里时间戳只到秒）
      usedTomb[t.id] = true;
      return false;
    });
    /* 导入后必须把对应的墓碑清掉，否则这些档案刚导进来，
     * 下次云同步又被墓碑删一遍 —— 表现为「导入成功、刷新又没了」。
     * 注意：原来这里算完 out.deleted 后，下面还有一行无条件重新赋值，
     * 把清理结果整个覆盖掉了，等于白做。现在收进 else 分支。 */
    if (ignoreTomb) {
      var aliveId = {}, aliveFp = {};
      out.records.forEach(function (r) {
        if (r.id) aliveId[r.id] = 1;
        var fp = recFp(r); if (fp) aliveFp[fp] = 1;
      });
      out.deleted = Object.keys(del).filter(function (k) {
        var t = del[k];
        if (aliveId[k]) return false;
        if (t.fp && aliveFp[t.fp]) return false;
        return true;
      }).map(function (k) { return del[k]; });
    } else {
      /* 常规（云同步）分支：档案活下来了，就该把对应的墓碑撤掉。
       * 「删除后又恢复 / 备份里捞回来」的记录时间戳比墓碑新，
       * 上面的过滤会保留它；这时墓碑已经没有意义，
       * 留着只会让它在别的设备上再误删一次，也会让 deleted 无限膨胀。 */
      var liveId = {}, liveFp = {};
      out.records.forEach(function (r) {
        if (r.id) liveId[r.id] = 1;
        var fp = recFp(r); if (fp) liveFp[fp] = 1;
      });
      out.deleted = Object.keys(del).filter(function (k) {
        var t = del[k];
        if (liveId[k]) return false;
        if (t.fp && liveFp[t.fp]) return false;
        return true;
      }).map(function (k) { return del[k]; });
    }

    // 3) 日志：先修正 rid，再去重
    var logs = {}, order = [];
    remapLogs(local.logs, idMap).concat(remapLogs(remote.logs, idMap)).forEach(function (l) {
      if (!l) return;
      if (!logs[l.id]) { logs[l.id] = l; order.push(l.id); }
    });
    var seen = {}, uniq = [];
    order.map(function (k) { return logs[k]; }).forEach(function (l) {
      var fp = [l.rid, l.from, l.to, l.operator, l.note, l.at].map(normKey).join('|');
      if (seen[fp]) return;
      seen[fp] = 1;
      uniq.push(l);
    });
    /* 【性能优化】原来用 localeCompare 排序 2000 条日志。
     * localeCompare 每次调用都要初始化本地化排序器，比纯字符串比较慢一到两个数量级，
     * 数据量一大（很久没同步的设备首次合并）这里要卡几百毫秒甚至更久。
     * 而 at 是 nowStr() 生成的定长 'YYYY-MM-DD HH:mm:ss'，
     * 字典序就等于时间序，直接用 < > 比较即可，结果完全等价。 */
    out.logs = uniq.sort(function (a, b) {
      var x = String(a.at || ''), y = String(b.at || '');
      if (x === y) return 0;
      return x < y ? 1 : -1;          // 倒序：新的在前
    }).slice(0, 2000);

    out.updatedAt = Math.max(local.updatedAt || 0, remote.updatedAt || 0);
    return out;
  }

  function applyFilter(records, opt) {
    var kw = (opt.keyword || '').trim().toLowerCase();
    return records.filter(function (r) {
      if (opt.status && r.status !== opt.status) return false;
      if (opt.category && r.category !== opt.category) return false;
      if (opt.level && r.level !== opt.level) return false;
      if (!kw) return true;
      return [r.title, r.code, r.owner, r.location, r.remark, r.category, r.tags]
        .join(' ').toLowerCase().indexOf(kw) >= 0;
    });
  }

  /* 【性能优化】列表排序在每次同步后都会跑一遍。
   * 原来的 localeCompare 每次比较都要重新初始化本地化排序器，
   * 几百条档案 × log n 次比较，在手机上能明显感到卡顿。
   * ① createdAt / code / updatedAt 是定长 ASCII 字符串，字典序即时间序，直接比较；
   * ② 名称排序确实需要中文拼音序，改用复用的 Intl.Collator 实例
   *    （构造一次反复用），比每次 localeCompare 快很多。 */
  var _zhCollator;
  function zhCompare(a, b) {
    if (_zhCollator === undefined) {
      try { _zhCollator = new Intl.Collator('zh'); } catch (e) { _zhCollator = null; }
    }
    if (_zhCollator) return _zhCollator.compare(a, b);
    return String(a).localeCompare(String(b), 'zh');
  }
  function cmpStr(a, b) {            // 倒序：大的在前
    var x = String(a || ''), y = String(b || '');
    if (x === y) return 0;
    return x < y ? 1 : -1;
  }
  function sortRecords(records, sort) {
    var arr = records.slice();
    arr.sort(function (a, b) {
      switch (sort) {
        case 'created': return cmpStr(a.createdAt, b.createdAt);
        case 'code': return cmpStr(a.code, b.code);
        case 'title': return zhCompare(String(a.title || ''), String(b.title || ''));
        default: return cmpStr(a.updatedAt, b.updatedAt);
      }
    });
    return arr;
  }

  // hash 路由：#m/档案ID   #r/云端空间地址   #d/压缩同步数据
  function parseHash(hash) {
    var out = { id: '', room: '', data: '', one: '', prov: '' };
    String(hash || '').replace(/^#/, '').split('&').forEach(function (seg) {
      var m = /^m\/(.+)$/.exec(seg);
      if (m) { out.id = decodeURIComponent(m[1]); return; }
      var r = /^r\/(.+)$/.exec(seg);
      if (r) { out.room = decodeURIComponent(r[1]); return; }
      var pv = /^p\/(.+)$/.exec(seg);
      if (pv) { out.prov = decodeURIComponent(pv[1]); return; }
      var d = /^d\/(.+)$/.exec(seg);
      if (d) { out.data = d[1]; return; }
      var a = /^a\/(.+)$/.exec(seg);
      if (a) out.one = a[1];
    });
    return out;
  }

  // ---------- 网址可用性判定 ----------
  // about:srcdoc / file: 这类地址另一台设备打不开，必须回退到用户设置的部署网址
  function isUsableUrl(u) { return /^https?:\/\//i.test(String(u || '')); }

  /* ---------- GitHub Pages 适配 ----------
   * GitHub Pages 有几个和其它托管不一样的地方，不处理就会「部署成功却打不开」：
   * 1) 强制 HTTPS：填 http:// 会被 301 跳转，微信里可能直接失败；
   * 2) 站点根目录必须叫 index.html，否则访问 /仓库名/ 会 404；
   * 3) 中文文件名必须做百分号编码，否则微信/扫码打不开；

  }
  /* 合并一组图片：同一张图（photoKey 相同）只留一份。
   * 多个版本时保留体积最小的 —— 那通常是压缩过的，
   * 符合用户点「压缩图片」的意图，也最省同步流量。 */
  function dedupePhotoList(list) {
    var groups = Object.create(null), order = [];
    (list || []).forEach(function (p) {
      if (!p || !p.data) return;                            // 丢弃空项
      var k = photoKey(p);
      if (!k) return;
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(p);
    });
    var out = [];
    order.forEach(function (k) {
      var g = groups[k];
      if (g.length === 1) { out.push(g[0]); return; }
      var best = g[0], bl = String(g[0].data || '').length;
      g.forEach(function (p) {
        var len = String(p.data || '').length;
        if (len < bl) { best = p; bl = len; }
      });
      // 保留压缩档位标记：任一版本压过就算压过，避免下次又被压一遍
      var pq = null;
      g.forEach(function (p) { if (p.pq) { if (!pq || PHOTO_ORDER[p.pq] < PHOTO_ORDER[pq]) pq = p.pq; } });
      var o = Object.assign({}, best);
      if (pq) o.pq = pq;
      out.push(o);
    });
    return out;
  }

  function recompressDataUrl(dataUrl, ps, pid) {
    return new Promise(function (resolve, reject) {
      if (!/^data:image\//.test(String(dataUrl || ''))) { reject(new Error('不是图片')); return; }
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          var scale = Math.min(1, ps.maxSide / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          var out;
          try { out = cv.toDataURL('image/jpeg', ps.quality); }
          catch (e) { out = cv.toDataURL('image/png'); }
          /* pid 必须原样带回去：换了数据但不能换身份，
           * 否则别的设备会把它当成一张新图，同步后变成两张。 */
          resolve({ data: out, w: cw, h: ch, pid: pid });
        } catch (e) { reject(e); }
      };
      img.onerror = function () { reject(new Error('图片解码失败')); };
      img.src = dataUrl;
    });
  }

  /* 统计所有档案图片占用的字符数，以及按某档位压缩后预计能降到多少。
   * 用于「批量压缩已存图片」前后对比，让用户看到实际收益再决定。 */
  function photoStats() {
    var total = 0, count = 0, withPhoto = 0, pending = 0;
    (db.records || []).forEach(function (r) {
      var ps = r && r.photos;
      if (!ps || !ps.length) return;
      withPhoto++;
      ps.forEach(function (p) {
        if (p && p.data) {
          count++; total += String(p.data).length;
          if (photoNeedsShrink(p)) pending++;
        }
      });
    });
    return { total: total, count: count, withPhoto: withPhoto, pending: pending };
  }

  /* 压缩已存图片的完整流程：确认 → 进度 → 结果。
   * 抽成公共函数，顶部按钮和设置里的按钮共用同一套逻辑，
   * 避免两处各写一遍、行为不一致。 */
  function askShrinkPhotos(ps, presetKey) {
    /* 设置页可能刚改了下拉框但还没点保存，
     * 这时 photoPresetKey() 读到的还是旧档位，判断会错。
     * 所以临时同步一下，用完再还原。 */
    var oldKey = db.settings.photoQuality;
    if (presetKey) db.settings.photoQuality = presetKey;
    var st = photoStats();
    if (!st.count) { db.settings.photoQuality = oldKey; toast('还没有图片', true); return; }
    if (!st.pending) {
      db.settings.photoQuality = oldKey;
      openModal('不需要压缩',
        '<p class="hint">全部 ' + st.count + ' 张图片都已按「<b>' + esc(ps.label) +
        '</b>」（或更省流量的档位）压缩过，再压一次只会让画质变差、体积几乎不变。</p>' +
        '<p class="hint">想再压小，请先把清晰度换成更省流量的档位。</p>',
        [{ text: '知道了', cls: 'btn ghost', fn: closeModal }]);
      return;
    }
    confirmDialog('压缩 ' + st.pending + ' 张图片',
      '按「<b>' + esc(ps.label) + '</b>」压缩 <b>' + st.pending + '</b> 张图片。<br><br>' +
      '· 当前占用 <b>' + fmtBytes(st.total) + '</b>，压缩后通常会明显变小，' +
      '<b>同步速度会跟着变快</b>（同步慢几乎都是图片造成的）。<br>' +
      (st.count > st.pending ? '· 另 <b>' + (st.count - st.pending) +
        '</b> 张已按该档位压过，会<b>自动跳过</b>（重复压缩只会让画质变差）。<br>' : '') +
      '· 图片会变模糊一点，<b>不可撤销</b> —— 建议先「备份/导出 → 导出备份文件」留一份。<br>' +
      '· 压完会自动保存，并推到云端（若开了云同步）。',
      '开始压缩',
      function () {
        var box = null;
        openModal('正在压缩…', '<p class="hint" id="shrinkMsg">准备中…</p>', []);
        box = document.getElementById('shrinkMsg');
        batchRecompressPhotos(ps, function (done, total) {
          if (box) box.textContent = '已处理 ' + done + ' / ' + total + ' 张…';
        }).then(function (r) {
          save();
          /* 压缩完顺手清一遍重复：之前若已被复制出多份，
           * 正好一并收拾掉，否则那些多余的份会一直占着体积。 */
          var dd = { removed: 0, records: 0 };
          try { dd = dedupePhotosNow(); } catch (e) {}
          save();
          var sv = r.before - r.after;
          var pct = r.before > 0 ? Math.round(sv / r.before * 100) : 0;
          var html = '<p class="hint">压缩完成：<b>' + fmtBytes(r.before) + '</b> → <b>' +
            fmtBytes(r.after) + '</b>（省了 ' + fmtBytes(sv) + '，约 ' + pct + '%）</p>' +
            (r.skipped ? '<p class="hint">已按当前档位压过的 ' + r.skipped +
              ' 张已跳过（重复压缩只会让画质变差，不会更小）。</p>' : '') +
            (dd.removed ? '<p class="hint">另外清理掉 <b>' + dd.removed +
              '</b> 张重复图片（同一张图被复制出多份）。</p>' : '') +
            (r.failed ? '<p class="hint" style="color:#b45309">' + r.failed + ' 张处理失败，已保留原图。</p>' : '') +
            (sv > 0 ? '<p class="hint">同步数据量小了，下次同步会明显变快。</p>'
                    : '<p class="hint">这些图本来就不大，压缩没有明显收益，已保留原图。</p>');
          openModal('压缩完成', html, [
            { text: '关闭', cls: 'btn ghost', fn: closeModal },
            { text: '立即同步', cls: 'btn primary', fn: function () { closeModal(); if (db.settings.syncOn && db.settings.room) syncNow(); else toast('未开启云同步'); } }
          ]);
          db.settings.photoQuality = oldKey;
          renderAll();
          refreshShrinkBtn();
        }).catch(function (e) {
          db.settings.photoQuality = oldKey;
          closeModal();
          toast('压缩失败：' + (e && e.message), true);
        });
      });
  }

  /* 顶部「🗜 压缩图片」按钮：没有图片时隐藏，有图片时显示张数。
   * 放在外面是为了随手能点 —— 图片是同步慢的头号原因，
   * 埋在设置里很多人根本找不到。 */
  function refreshShrinkBtn() {
    var btn = $('#btnShrinkTop');
    if (!btn) return;
    var st = photoStats();
    /* 没有可压的就隐藏：全都是当前档位（或更省）压过的了，
     * 再压只会让画质变差，不该给用户这个按钮去点。 */
    if (!st.count || !st.pending) { btn.hidden = true; return; }
    btn.hidden = false;
    btn.textContent = '🗜 压缩图片（' + st.pending + '）';
    btn.title = '按「' + photoPreset().label + '」压缩这 ' + st.pending +
      ' 张图片（当前占 ' + fmtBytes(st.total) + '）' +
      (st.count > st.pending ? '；另 ' + (st.count - st.pending) + ' 张已压过，会跳过' : '');
  }

  /* 清理本机已有的重复图片。
   * 已经被旧版本复制出多份的档案，光修好合并逻辑不会自动消失 ——
   * 那些多出来的份还在数据里。这里按同一套稳定标识去重，只留一份最小的。 */
  function dedupePhotosNow() {
    var removed = 0, touched = 0;
    (db.records || []).forEach(function (r) {
      if (!r || !r.photos || r.photos.length < 2) return;
      var before = r.photos.length;
      var after = dedupePhotoList(r.photos);
      if (after.length !== before) {
        removed += (before - after.length);
        touched++;
        r.photos = after;
        touchFat(r, 'photos');
      }
    });
    if (touched) { save(); renderAll(); refreshShrinkBtn(); }
    return { removed: removed, records: touched };
  }

  /* 批量压缩已存图片。
   * 「图片清晰度」档位只对新上传的图生效，已经存下来的旧图不会变 ——
   * 所以档案一多、图片一积累，同步就越来越慢，而用户改档位也没用。
   * 这个函数把旧图按当前档位重新压一遍，是真正能解决「东西一多同步就慢」的手段。 */
  function batchRecompressPhotos(ps, onProgress) {
    /* 【重要】只挑「还需要压」的图。
     * 已经压到当前档位或更省档位的必须跳过：
     * JPEG 每重新编码一次画质就劣化一次，而体积往往还会再小几 KB，
     * 于是很容易被当成「有效果」反复执行 —— 点几次图就废了。 */
    var jobs = [], skipped = 0;
    (db.records || []).forEach(function (r) {
      if (!r || !r.photos || !r.photos.length) return;
      r.photos.forEach(function (p, i) {
        if (!p || !/^data:image\//.test(String(p.data || ''))) return;
        if (!photoNeedsShrink(p)) { skipped++; return; }
        jobs.push({ rec: r, idx: i, src: p.data });
      });
    });
    var before = 0;
    jobs.forEach(function (j) { before += j.src.length; });
    var after = 0, done = 0, failed = 0;
    // 串行处理：图片解码很吃内存，并行容易在手机上被浏览器杀掉
    return jobs.reduce(function (chain, j) {
      return chain.then(function () {
        return recompressDataUrl(j.src, ps, j.rec.photos[j.idx].pid).then(function (out) {
          var orig = j.src.length;
          /* 压完反而更大就保留原图 —— 有些小图重编码后会膨胀，
           * 强行替换只会让同步更慢。 */
          /* 不管这次有没有真的变小，都要记下档位：
           * 这张图已经按该档位处理过了，下次不该再压一遍。
           * （没变大的情况保留原图，避免越压越大。） */
          j.rec.photos[j.idx].pq = photoPresetKey();
          /* 老图可能没有 pid（旧版本传上来的），这里补上一个，
           * 之后跨设备同步就能认出是同一张，不会再翻倍。 */
          if (!j.rec.photos[j.idx].pid) j.rec.photos[j.idx].pid = out.pid || uid();
          if (out.data && out.data.length < orig) {
            j.rec.photos[j.idx].data = out.data;
            if (out.w) j.rec.photos[j.idx].w = out.w;
            if (out.h) j.rec.photos[j.idx].h = out.h;
            after += out.data.length;
          } else {
            after += orig;
          }
          done++;
          if (onProgress) onProgress(done, jobs.length);
        }).catch(function () { failed++; after += j.src.length; done++; if (onProgress) onProgress(done, jobs.length); });
      });
    }, Promise.resolve()).then(function () {
      return { before: before, after: after, count: jobs.length, failed: failed, skipped: skipped };
    });
  }

  // 估算当前占用（localStorage 上限通常约 5,000,000 个 UTF-16 字符）
  function storageChars() {
    try {
      var total = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        var v = localStorage.getItem(k);
        total += (k ? k.length : 0) + (v ? v.length : 0);
      }
      return total;
    } catch (e) { return 0; }
  }

  function photoChars(list) {
    return (list || []).reduce(function (n, p) { return n + String(p && p.data || '').length; }, 0);
  }

  function addLogQuiet() {}

  function createRecord(data) {
    var ts = nowStr();
    var r = {
      id: uid(), rev: 1,
      code: (data.code || '').trim() || genCode(db.settings.codePrefix, db.records),
      title: (data.title || '').trim(),
      category: data.category || '', status: data.status || db.settings.statuses[0],
      level: data.level || '', owner: data.owner || '', location: data.location || '',
      docDate: data.docDate || '', dueDate: data.dueDate || '',
      tags: data.tags || '', remark: data.remark || '',
      photos: Array.isArray(data.photos) ? data.photos : [],
      createdAt: ts, updatedAt: ts
    };
    // 初始化每个字段的改动时刻，之后合并才能逐字段比较
    r.fat = {};
    var t0 = Date.now();
    ['code', 'title', 'category', 'level', 'owner', 'location',
     'docDate', 'dueDate', 'tags', 'remark', 'status', 'photos'].forEach(function (f) {
      r.fat[f] = t0;
    });
    db.records.push(r);
    var logLen = db.logs.length;
    addLog(r.id, '', r.status, data.operator || db.settings.operator || '系统', '创建档案');
    // 落盘失败（多半是图片撑爆本机存储）要回滚，否则界面显示有、刷新就没了
    if (!save()) { db.records.pop(); db.logs.length = logLen; return null; }
    return r;
  }

  function updateRecord(id, data) {
    var r = findRecord(id);
    if (!r) return null;
    var fields = ['code', 'title', 'category', 'level', 'owner', 'location', 'docDate', 'dueDate', 'tags', 'remark', 'photos'];
    r.fat = r.fat || {};
    fields.forEach(function (f) {
      if (data[f] == null) return;
      // 只有真的变了才更新时间戳 —— 否则「B 只改负责人」会把 status 的时间戳
      // 一起顶新，反而覆盖掉 A 刚改的状态
      if (JSON.stringify(r[f]) !== JSON.stringify(data[f])) { r[f] = data[f]; touchFat(r, f); }
    });
    if (data.status && data.status !== r.status) {
      addLog(r.id, r.status, data.status, data.operator || db.settings.operator || '系统', data.note || '编辑时变更状态');
      r.status = data.status;
      touchFat(r, 'status');
    }
    r.rev = (r.rev || 1) + 1;
    var mx = 0, k;
    for (k in (r.fat || {})) { if (r.fat[k] > mx) mx = r.fat[k]; }
    r.updatedAt = fmtTs(mx) || nowStr();
    if (!save()) return null;
    return r;
  }

  function setStatus(id, status, operator, note) {
    var r = findRecord(id);
    if (!r) return null;
    /* 状态没变就什么都不做。
     * 原来无条件记日志 + 更新时间戳 + rev+1，于是多个用户都点同一个状态时，
     * 每次都会产生一条「开窗 → 开窗」的冗余日志，数据指纹跟着变，
     * 每台都要再推一次 —— 纯属浪费配额。
     * 返回 'unchanged' 让调用方提示用户，而不是假装更新成功。 */
    if (r.status === status) return 'unchanged';
    addLog(r.id, r.status, status, operator || '扫码用户', note || '');
    r.status = status;
    touchFat(r, 'status');
    r.rev = (r.rev || 1) + 1;
    var mx2 = 0, k2;
    for (k2 in (r.fat || {})) { if (r.fat[k2] > mx2) mx2 = r.fat[k2]; }
    r.updatedAt = fmtTs(mx2) || nowStr();
    save();
    return r;
  }

  // 删除并返回快照（用于撤销）；墓碑带时间戳，其它设备同步时也会移除
  function deleteRecord(id) {
    var rec = findRecord(id);
    if (!rec) return null;
    var logs = db.logs.filter(function (l) { return l.rid === id; });
    db.records = db.records.filter(function (r) { return r.id !== id; });
    db.logs = db.logs.filter(function (l) { return l.rid !== id; });
    db.deleted = db.deleted.filter(function (d) { return d.id !== id; });
    // 墓碑带上内容指纹：另一台设备上同一条档案 id 不同，也能正确同步删除
    db.deleted.push({ id: id, at: Date.now(), fp: recFp(rec) });
    save();
    return { record: rec, logs: logs };
  }

  // 撤销删除：放回记录、恢复日志、移除墓碑
  function restoreDeleted(snap) {
    if (!snap || !snap.record) return false;
    var id = snap.record.id;
    if (findRecord(id)) return false;
    db.deleted = db.deleted.filter(function (d) { return d.id !== id; });
    db.records.push(snap.record);
    (snap.logs || []).forEach(function (l) {
      if (!db.logs.some(function (x) { return x.id === l.id; })) db.logs.push(l);
    });
    db.logs.sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
    save();
    renderAll();
    syncNow(true);
    return true;
  }

  // 把本机已有的重复档案合并掉（历史同步产生的重复项，用它一次性清理）
  function dedupeNow() {
    var d = dedupeList(db.records);
    var removed = db.records.length - d.list.length;
    if (!removed) return 0;
    db.records = d.list;
    db.logs = remapLogs(db.logs, d.idMap);
    // 日志按内容去重（合并后可能出现同一条变更的两份记录）
    var seen = {}, uniq = [];
    db.logs.forEach(function (l) {
      var fp = [l.rid, l.from, l.to, l.operator, l.note, l.at].map(normKey).join('|');
      if (seen[fp]) return;
      seen[fp] = 1;
      uniq.push(l);
    });
    db.logs = uniq;
    save();
    return removed;
  }

  // 自定义确认框：不依赖原生 confirm（微信内置浏览器会拦截 confirm，点了没反应）
  /* 第三个按钮 altText 是可选的次要操作。
   * 之前把「覆盖导入」挂在 onCancel 上 —— 结果界面只显示「取消 / 合并」，
   * 根本没有「覆盖」按钮，而用户点「取消」反而触发了覆盖流程。 */
  function confirmDialog(title, msg, okText, onOk, onCancel, altText, altFn) {
    var html = '<p class="hint" style="font-size:14px;line-height:1.7">' + msg + '</p>';
    var btns = [];
    if (altText && altFn) {
      btns.push({ text: altText, cls: 'btn danger', fn: function () { closeModal(); altFn(); } });
    }
    btns.push({ text: '取消', cls: 'btn ghost', fn: function () { closeModal(); } });
    btns.push({ text: okText || '确定', cls: 'btn primary', fn: function () { closeModal(); onOk(); } });
    openModal(title, html, btns);
    if (onCancel) { /* 兼容旧调用：onCancel 仍作为点取消后的回调 */ }
  }

  function findRecord(id) {
    return db.records.filter(function (r) { return r.id === id; })[0] || null;
  }

  /* ---------------- 云同步 ---------------- */
  // GitHub API 配额情况（由响应头 X-RateLimit-* 更新）
  var quota = { remaining: null, limit: null, resetAt: 0, etag: '', updatedAt: 0 };

  var QUOTA_KEY = 'archive_quota_v1';

  // 额度信息持久化到本机（令牌额度是账号级的，存一份够用）
  function loadQuota() {
    try {
      var raw = localStorage.getItem(QUOTA_KEY);
      if (!raw) return;
      var q = JSON.parse(raw);
      if (q && typeof q === 'object') {
        quota.remaining = q.remaining; quota.limit = q.limit;
        quota.resetAt = q.resetAt || 0; quota.etag = q.etag || '';
        quota.updatedAt = q.updatedAt || 0;
      }
    } catch (e) {}
  }
  function saveQuota() {
    try {
      localStorage.setItem(QUOTA_KEY, JSON.stringify({
        remaining: quota.remaining, limit: quota.limit, resetAt: quota.resetAt,
        etag: quota.etag, updatedAt: quota.updatedAt
      }));
    } catch (e) {}
  }

  // 顶部显示“剩余 N / 5000 次”，额度偏低时变色提醒
  // 同步进行中：顶部换成「同步中…」，让用户知道在干活而不是卡住了
  function renderSyncing(label) {
    var el = $('#quotaText');
    if (!el) return;
    if (!db.settings.syncOn || db.settings.provider !== 'gist') return;
    el.hidden = false;
    el.className = 'quota-txt';
    el.innerHTML = '<b>' + esc(label || '同步中…') + '</b>';
  }

  function renderQuota() {
    var el = $('#quotaText');
    if (!el) return;
    if (!db.settings.syncOn || db.settings.provider !== 'gist') { el.hidden = true; return; }
    if (quota.remaining === null || isNaN(quota.remaining)) { el.hidden = true; return; }
    el.hidden = false;
    var lim = quota.limit || 5000;
    var pct = lim > 0 ? (quota.remaining / lim) : 1;
    el.className = 'quota-txt' + (quota.remaining <= 0 ? ' out' : (pct < 0.1 ? ' low' : ''));
    var txt = 'GitHub 额度 <b>' + quota.remaining + '</b> / ' + lim;
    if (quota.resetAt > Date.now()) txt += '（' + resetClockText() + ' 重置）';
    el.innerHTML = txt;
    var dot = $('#statusDot');
    if (dot) {
      var base = dot.title || '';
      if (base.indexOf('额度') < 0) dot.title = base + ' · 剩余额度 ' + quota.remaining + '/' + lim;
    }
  }

  function isRateLimit(d) {
    var m = (d && d.message) ? String(d.message) : '';
    return /rate limit/i.test(m);
  }

  /* 新建 / 保存后「保存中…」的倒数时长（毫秒）。
   * 档案本身是立即落盘的，这只是一个可见的进度反馈，不宜过长影响手感。 */
  var SAVE_PROGRESS_MS = 300;

  /* ---------- 待推送标记（防止“改完就关页面，同步没发出去”）----------
   * 页面一关，还在飞行中的普通 fetch 会被浏览器中断，改动就丢了。
   * 这里用一个持久化的标记记住“本机还有改动没推上云”，
   * 关闭时用 keepalive 请求补发一次；实在没发出去，下次打开页面会自动补传。
   */
  var PENDING_KEY = 'archive_pending_sync_v1';

  function markDirty() {
    syncState.dirty = true;
    try { localStorage.setItem(PENDING_KEY, String(Date.now())); } catch (e) {}
    renderDotDirty();
  }
  function clearDirty() {
    syncState.dirty = false;
    try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
    renderDotDirty();
  }
  function hasPendingPush() {
    try { return !!localStorage.getItem(PENDING_KEY); } catch (e) { return false; }
  }

  /* 上次成功推上云端的数据指纹。
   * 原来只存在内存里，页面一重启就丢失，于是每次打开都会无条件再推一次，
   * 白白消耗一次 PATCH。持久化之后，只要本机数据没变就能直接跳过写入。
   * 只存短指纹（长度+哈希），不存全文，避免占用本机空间。 */
  var PUSHED_KEY = 'archive_pushed_fp_v1';

  /* 规范化指纹：本地和云端的数据都能算出可比的值。
   * 关键在于排序 + 只取实质字段，否则字段顺序不同就会算出不同指纹，
   * 导致"本地其实和云端一样"也判断不出来，白推一次。 */
  function docFingerprint(records, logs, deleted) {
    records = (records || []).filter(function (r) { return !r.demo; });
    var rs = (records || []).map(function (r) {
      return String(r.id || '') + '|' + sigOfRec(r) + '|' + (r.rev || 0) + '|' + (r.noAutoDel ? 1 : 0);
    }).sort();
    var ls = (logs || []).map(function (l) { return String(l.id || ''); }).sort();
    var ds = (deleted || []).map(function (d) {
      return String(d.id || '') + '|' + String(d.at || '') + '|' + String(d.fp || '');
    }).sort();
    var str = JSON.stringify({ r: rs, l: ls, d: ds });
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) % 1000000007; }
    return str.length + ':' + h.toString(36);

  }

  function pushFingerprint() {
    return docFingerprint(syncableRecords(), db.logs, db.deleted);
  }
  function loadPushed() {
    try { syncState.lastPushed = localStorage.getItem(PUSHED_KEY) || ''; } catch (e) {}
  }
  function savePushed(fp) {
    syncState.lastPushed = fp;
    try { localStorage.setItem(PUSHED_KEY, fp); } catch (e) {}
  }
  function renderDotDirty() {
    var d = $('#statusDot');
    if (!d || !db.settings.syncOn) return;
    if (syncState.dirty) {
      d.style.background = '#d97706';
      d.title = '有改动还没同步到云端（关页面前会自动补发）';
    }
  }

  /* 推荐同步间隔：N 台设备共享 5000 次/小时，每次同步最多 2 个请求。
   * 需要 N × (3600/S) × 2 ≤ 5000，即 S ≥ 1.44N 秒；再留 2 倍余量取 3N，
   * 并限定在 30~600 秒之间。
   */
  function recommendInterval() {
    var n = Math.max(1, parseInt(db.settings.deviceCount, 10) || guessDeviceCount());
    return Math.min(600, Math.max(30, Math.round(n * 3)));
  }
  function guessDeviceCount() {
    // 没填就按 3 台估算，给出一个保守建议
    return 3;
  }
  function recommendIntervalText() {
    var n = Math.max(1, parseInt(db.settings.deviceCount, 10) || guessDeviceCount());
    return '按 <b>' + n + ' 台设备</b>算，建议调到 <b>' + recommendInterval() + ' 秒</b>以上';
  }

  function resetClockText() {
    if (!quota.resetAt || quota.resetAt <= Date.now()) return '';
    var d = new Date(quota.resetAt), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // GitHub 的额度按约 1 小时的窗口滚动恢复，读不到头也能给出可用提示
  function quotaText() {
    var t = '';
    if (quota.remaining !== null && !isNaN(quota.remaining)) t += '剩余 ' + quota.remaining + ' 次';
    if (quota.resetAt && quota.resetAt > Date.now()) {
      t += (t ? '，' : '') + '约 ' + resetClockText() + ' 恢复';
    }
    return t || '本小时额度已用完（约 1 小时内自动恢复）';
  }

  var PROVIDERS = {
    /* GitHub Gist：用你自己的 GitHub 存数据，最稳、不依赖第三方匿名服务。
     * 需要一个只勾选 gist 权限的令牌，在 github.com/settings/tokens 生成。 */
    gist: {
      label: 'GitHub Gist（需令牌，最稳，推荐）',
      needToken: true,
      file: 'archive-sync.json',
      token: function () {
        /* 优先用设置框里「当前填着的」令牌，而不是只信已保存的值。
         * 实测出的真 bug：用户填完令牌和空间地址，直接点「测试连接」——
         * 此时令牌还没写进 db.settings，读出来是空的，
         * 于是报「还没填令牌」，用户明明填了却被拦在这里。
         * 所有云操作都应以界面上当前填的值为准。 */
        var inp = document.getElementById('setToken');
        var typed = inp && inp.value ? String(inp.value).trim() : '';
        var t = typed || String((db.settings && db.settings.gistToken) || '').trim();
        if (!t) throw new Error('还没填 GitHub 令牌。点下面的「怎么拿令牌」看 30 秒生成步骤。');
        return t;
      },
      hdr: function () {
        var tk = PROVIDERS.gist.token();
        /* 没填令牌时要明确报错。
         * 实测：不填令牌直接同步，一个请求都不会发出去、
         * 界面却显示「已保存」，用户根本不知道差在哪一步。 */
        if (!tk) throw new Error('还没填 GitHub 令牌。请到「设置 → GitHub 令牌」填一个只勾 gist 权限的令牌（点「怎么拿令牌」有 30 秒生成步骤）。');
        return {
          Authorization: 'Bearer ' + tk,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json',
          'X-GitHub-Api-Version': '2022-11-28'
        };
      },
      create: function () {
        var self = PROVIDERS.gist;
        return fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: self.hdr(),
          body: JSON.stringify({
            description: '档案管理系统 · 云同步数据',
            public: false,
            files: (function () { var o = {}; o[self.file] = { content: JSON.stringify(emptyDoc()) }; return o; })()
          })
        }).then(function (r) {
          return r.json().then(function (d) {
            if (!r.ok) throw new Error(self.err(r.status, d));
            if (d && d.id) return String(d.id);
            throw new Error('未能获取 Gist 编号');
          });
        });
      },
      /* 云端数据超过 1 MB 时的提示。
       * 不说「解析失败」这种让人无从下手的话，直接给出可执行的解法。 */
      /* 从 Gist 响应里解析出完整文档，自动兼容两种存储格式：
       * ① 单文件（老格式 / 小数据）：archive-sync.json 里就是全部数据；
       * ② 分片（大数据）：archive-sync.json 只是索引，真实数据分散在 arc-part-N.json。
       * 分片模式下每片都远小于 1 MB，所以能完整读回来 ——
       * 这正是突破「单个文件最多 1 MB」限制的关键。 */
      parseDoc: function (d) {
        var self = PROVIDERS.gist;
        var f = d && d.files && d.files[self.file];
        if (!f) throw new Error('Gist 里没有数据文件，可能被删了或填错了编号');
        var txt = (typeof f.content === 'string') ? f.content : '';
        if (!txt) return Promise.resolve(emptyDoc());
        var idx = null;
        try { idx = JSON.parse(txt); } catch (e) { idx = null; }
        // 单文件模式
        if (!idx || !idx.sharded || !idx.parts || !idx.parts.length) {
          /* 单文件且被截断（超过 1 MB）。
           * 正常情况下新版程序早就分片了，不该出现这种单文件大包 ——
           * 所以多半是「还有设备在用旧版程序」：旧版不认识分片，
           * 会把索引当成空云端，再把自己那份整包写回单个文件。
           * 必须把这点说清楚，否则用户只会反复排查令牌和空间地址。 */
          var names = Object.keys(d.files || {});
          if (f.truncated) {
            syncState.sawTruncatedSingle = true;
            return self.fetchRaw(f).then(function (t) { var dd = JSON.parse(t); dd.__files = names; return dd; });
          }
          var sd = JSON.parse(txt);
          if (sd && typeof sd === 'object') sd.__files = names;
          return Promise.resolve(sd);
        }
        /* 读到了分片索引：说明云端是新版写的，正常。 */
        syncState.sawSharded = true;
        // 分片模式：按顺序把所有片拼起来
        var names = idx.parts;
        var chain = Promise.resolve('');
        names.forEach(function (nm) {
          chain = chain.then(function (buf) {
            var pf = d.files[nm];
            if (!pf) throw new Error('云端分片缺失：' + nm + '（数据不完整，建议重新上传）');
            if (pf.truncated) return self.fetchRaw(pf).then(function (t) { return buf + t; });
            return buf + (typeof pf.content === 'string' ? pf.content : '');
          });
        });
        return chain.then(function (all) {
          try {
            var dd = JSON.parse(all);
            dd.__files = Object.keys(d.files || {});
            return dd;
          } catch (e) { throw new Error('云端数据损坏，无法解析'); }
        });
      },
      fetchRaw: function (f) {
        var self = PROVIDERS.gist;
        if (!f.raw_url) throw new Error(self.truncErr(f.size));
        return fetch(f.raw_url, { headers: {} }).then(function (rr) {
          if (!rr.ok) throw new Error(self.truncErr(f.size));
          return rr.text();
        }).then(function (t) {
          if (!t) throw new Error(self.truncErr(f.size));
          return t;
        });
      },
      truncErr: function (size) {
        var sz = size ? fmtBytes(size) : '超过 1 MB';
        return '云端数据太大（' + sz + '）：GitHub 的 Gist 接口每次最多只能返回 1 MB，' +
          '超出的部分读不回来，所以同步失效。解决办法：' +
          '① 到「设置 → 图片清晰度」点「🗜 压缩已存的 N 张图片」（图片是体积主体，最有效）；' +
          '② 删掉一些档案里不必要的图片；' +
          '③ 或者改用「🔗 同步链接」手动传，不占云端空间。';
      },
      read: function (room) {
        var self = PROVIDERS.gist;
        if (self.readIfChanged) return self.readIfChanged(room);
        return fetch('https://api.github.com/gists/' + encodeURIComponent(room), { headers: self.hdr() })
          .then(function (r) {
            self.noteQuota(r);
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(self.err(r.status, d));
              return self.parseDoc(d);
            });
          });
      },
      write: function (room, payload, noIfMatch) {
        var self = PROVIDERS.gist;
        var txt = JSON.stringify(payload);
        /* 【体积预警】Gist 接口读取时最多只给 1 MB。
         * 写得进去（上限约 10 MB）却读不回来，是很坑的一种失败：
         * 界面显示「已同步」，别的设备却永远拉不到。
         * 所以接近/超过 1 MB 时就在本机提示，让用户及时瘦身。 */
        var bl = byteLen(txt);
        /* 体积提示。注意：有了分片之后 1 MB 不再是死线，
         * 真正的天花板是「分片上限 × 每片大小」（约 8 MB）。
         * 所以只在接近/超过分片上限时才警告，
         * 不再因为过了 1 MB 就吓唬用户（分片模式下 1~8 MB 是能正常同步的）。 */
        var capBytes = SHARD_SIZE * SHARD_MAX_PARTS;
        if (bl > capBytes) {
          syncState.tooBig = bl;
          try {
            toast('云端数据已达 ' + fmtBytes(bl) + '，超过分片上限（约 ' + fmtBytes(capBytes) +
              '），请压缩图片', true, {
              label: '去压缩', fn: function () { setTimeout(openSettings, 150); }
            });
          } catch (e) {}
        } else if (bl > GIST_WARN_LIMIT) {
          try {
            toast('云端数据 ' + fmtBytes(bl) + '，已启用分片存储（图片多时可压缩以加快同步）', false);
          } catch (e) {}
        }

        var body = { files: {} };
        var oldParts = syncState.lastShardCount || 0;
        var parts = null;
        if (bl > SHARD_THRESHOLD) parts = shardText(txt, SHARD_SIZE);

        if (parts && parts.length > 1) {
          /* 分片模式：archive-sync.json 退化为一个很小的索引，
           * 真实数据分散到 arc-part-N.json，每片都远小于 1 MB。
           * GET /gists/{id} 会一次性返回所有文件的内容，
           * 所以读取仍然是 1 个请求，配额消耗不变。 */
          var names = [];
          parts.forEach(function (pt, i) {
            var nm = 'arc-part-' + (i + 1) + '.json';
            body.files[nm] = { content: pt };
            names.push(nm);
          });
          body.files[self.file] = {
            content: JSON.stringify({
              app: 'archive', v: 2, sharded: true, parts: names,
              bytes: bl, updatedAt: (payload && payload.updatedAt) || 0,
              client: (payload && payload.client) || ''
            })
          };
          syncState.lastShardCount = parts.length;
        } else {
          body.files[self.file] = { content: txt };
          syncState.lastShardCount = 0;
        }
        /* 清理上一版残留的分片：数据变小后旧片会一直占着空间，
         * 而且解析时若索引里没列出它们，就会被当成垃圾留在 Gist 里。
         * Gist 用 files:{名:null} 表示删除该文件。 */
        var newCount = syncState.lastShardCount;
        for (var k = newCount + 1; k <= Math.max(oldParts, newCount); k++) {
          body.files['arc-part-' + k + '.json'] = null;
        }
        /* 乐观并发控制：带上 If-Match，让 GitHub 在云端已被别台设备改过时
         * 直接返回 412，而不是让我们盲目覆盖。
         * 这是服务端原子保证，比客户端「先查再写」可靠得多——
         * 后者在 check 和 write 之间仍有窗口会被插队。
         * （GitHub 的 CORS 头 Access-Control-Allow-Headers 含 If-Match，可用。） */
        var h = self.hdr();
        /* If-Match 需要强校验器，而 GitHub 返回的 ETag 常带 W/ 前缀（弱校验器）。
         * 直接把 W/"xxx" 塞进去会被拒绝（400），所以先剥成 "xxx" 再用。
         * 万一剥离后仍被拒，下面会自动去掉这个头重试一次。 */
        var em = String(quota.etag || '').replace(/^W\//, '');
        // 上次带 If-Match 被拒过就别再带了：否则每次写入都要白试一次，
        // 请求翻倍，配额白白消耗一半
        if (em && !noIfMatch && !self._noIfMatch) h['If-Match'] = em;
        var usedIfMatch = !!(h['If-Match']);
        return fetch('https://api.github.com/gists/' + encodeURIComponent(room), {
          method: 'PATCH', headers: h, body: JSON.stringify(body)
        }).then(function (r) {
          self.noteQuota(r);
          if (r.status === 412) {
            // 云端被改过：抛一个可识别的错误，交给 syncNow 重新合并后重试
            throw new Error('CONFLICT_412');
          }
          /* 400 多半是这个 If-Match 头不被接受（弱 ETag / 格式问题）。
           * 自动去掉它重试一次，避免用户被这个头永久卡死 ——
           * 并发保护只是锦上添花，不该让同步彻底用不了。 */
          if (r.status === 400 && usedIfMatch) {
            self._noIfMatch = true;   // 记住，之后不再带
            return self.write(room, payload, true);
          }
          if (!r.ok) return r.json().then(function (d) { throw new Error(self.err(r.status, d)); });
          // 写过之后云端是“新版本”，要把 ETag 换成写响应里的新值：
          // 继续用旧 ETag 会命中 304，反而漏掉别人推上来的改动。
          // 若响应没给 ETag（少数情况），清空退化为普通 200 读取，安全。
          var net = null;
          try { net = r.headers.get('ETag'); } catch (e) {}
          quota.etag = net || '';
          saveQuota();
          /* 写入成功后云端条数就是刚推上去的这些。
           * 不更新的话，紧接着的提示会拿「写入前」的云端条数（0）去判断，
           * 明明刚传上去 60 条，却弹「云端是空的」，把用户吓一跳。 */
          if (payload && payload.records) syncState.lastRemoteCount = payload.records.length;
          return true;
        });
      },
      /* 写前校验：云端自本次读取以来有没有被别的设备改过。
       * 用 If-None-Match 条件请求 —— 没变时返回 304，不消耗配额。
       * 这是防止「A、B 同时改，后写的覆盖先写的」的关键：
       * 不做这一步，B 读到的旧云端 + B 的改动写上去，会把 A 在此期间
       * 推上去的内容整个抹掉。 */
      checkFresh: function (room, etag) {
        var self = PROVIDERS.gist;
        if (!etag) return Promise.resolve({ changed: true });  // 没有基准就当作变了
        var h = self.hdr();
        h['If-None-Match'] = etag;
        return fetch('https://api.github.com/gists/' + encodeURIComponent(room), { headers: h })
          .then(function (r) {
            self.noteQuota(r);
            if (r.status === 304) return { changed: false };
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(self.err(r.status, d));
              var f = d && d.files && d.files[self.file];
              if (!f) return { changed: false };
              var txt = (typeof f.content === 'string') ? f.content : '';
              if (!txt) return { changed: true, doc: emptyDoc() };
              try { return { changed: true, doc: JSON.parse(txt) }; }
              catch (e) { throw new Error('云端数据损坏，无法解析'); }
            });
          });
      },
      /* 页面关闭时的补发通道：用 keepalive，浏览器会保证请求发出去，
       * 即使页面已经卸载。上限 64KB，超了只能等下次打开补传。 */
      writeRaw: function (room, payload) {
        var self = PROVIDERS.gist;
        var body = { files: {} };
        body.files[self.file] = { content: JSON.stringify(payload) };
        var str;
        try { str = JSON.stringify(body); } catch (e) { return false; }
        if (str.length > 60000) return false;   // keepalive 请求体上限 64KB，留点余量
        try {
          fetch('https://api.github.com/gists/' + encodeURIComponent(room), {
            method: 'PATCH', headers: self.hdr(), body: str, keepalive: true
          });
          return true;
        } catch (e) { return false; }
      },
      // 记录 GitHub 的配额头：剩余次数 / 上限 / 重置时刻
      noteQuota: function (r) {
        try {
          var h = r.headers || {};
          var rem = h.get('X-RateLimit-Remaining');
          var lim = h.get('X-RateLimit-Limit');
          var rst = h.get('X-RateLimit-Reset');
          if (rem !== null && rem !== undefined) { quota.remaining = parseInt(rem, 10); quota.updatedAt = Date.now(); }
          if (lim !== null && lim !== undefined) quota.limit = parseInt(lim, 10);
          if (rst) quota.resetAt = parseInt(rst, 10) * 1000;
          saveQuota();
          renderQuota();
        } catch (e) {}
      },
      /* ---------- 版本历史：被删的档案能在这里找回来 ----------
       * GitHub 会保留 Gist 的每一次修改。档案被删后，当前版本里已经没有它了，
       * 但删除前的那个历史版本里还在。所以「找回」= 去历史版本里把它捞回来。 */
      listVersions: function (room, limit) {
        var self = PROVIDERS.gist;
        return fetch('https://api.github.com/gists/' + encodeURIComponent(room) + '/commits', { headers: self.hdr() })
          .then(function (r) {
            self.noteQuota(r);
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(self.err(r.status, d));
              if (!Array.isArray(d)) throw new Error('读不到版本历史（可能空间地址不对）');
              return d.slice(0, limit || 30).map(function (c) {
                return { version: String(c.version || ''), at: c.committed_at || '' };
              }).filter(function (v) { return !!v.version; });
            });
          });
      },
      readVersion: function (room, sha) {
        var self = PROVIDERS.gist;
        return fetch('https://api.github.com/gists/' + encodeURIComponent(room) + '/' + encodeURIComponent(sha), { headers: self.hdr() })
          .then(function (r) {
            self.noteQuota(r);
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(self.err(r.status, d));
              var f = d && d.files && d.files[self.file];
              if (!f) return emptyDoc();
              var txt = (typeof f.content === 'string') ? f.content : '';
              if (!txt) return emptyDoc();
              try { return normaliseRemote(JSON.parse(txt)); } catch (e) { return emptyDoc(); }
            });
          });
      },

      // 条件请求：带上 If-None-Match，云端没变时 GitHub 返回 304，
      // 304 不消耗配额。GitHub 的 CORS 头里已开放 ETag 与 If-None-Match。
      /* 清空云端：写一个空文档覆盖掉。
       * 注意这只改「当前内容」，GitHub 仍然保留历史版本，
       * 想连历史一起抹掉必须删除整个 Gist（见设置里的指引）。 */
      clear: function (room) {
        var self = PROVIDERS.gist;
        var empty = { app: 'archive', v: 1, updatedAt: Date.now(), records: [], logs: [], deleted: [] };
        return fetch('https://api.github.com/gists/' + encodeURIComponent(room), {
          method: 'PATCH',
          headers: self.hdr(),
          body: JSON.stringify({ files: { 'archive-sync.json': { content: JSON.stringify(empty) } } })
        }).then(function (r) {
          self.noteQuota(r);
          return r.json().then(function (d) {
            if (!r.ok) throw new Error(self.err(r.status, d));
            return true;
          });
        });
      },
      readIfChanged: function (room) {
        var self = PROVIDERS.gist;
        var h = self.hdr();
        if (quota.etag) h['If-None-Match'] = quota.etag;
        return fetch('https://api.github.com/gists/' + encodeURIComponent(room), { headers: h })
          .then(function (r) {
            self.noteQuota(r);
            if (r.status === 304) return { unchanged: true };
            var et = null;
            try { et = r.headers.get('ETag'); } catch (e) {}
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(self.err(r.status, d));
              if (et) { quota.etag = et; saveQuota(); }
              /* parseDoc 会自动处理：单文件 / 分片 / 单文件被截断三种情况。 */
              return self.parseDoc(d).catch(function (e) {
                /* raw 域取不到（网络受限 / CORS 被拦）时，
                 * 把话说清楚：不是程序坏了，是数据太大必须瘦身。 */
                var m = String((e && e.message) || '');
                if (m.indexOf('太大') >= 0 || m.indexOf('损坏') >= 0) throw e;
                throw new Error(m || '云端数据读取失败');
              });
            });
          });
      },
      err: function (status, d) {
        var msg = (d && d.message) ? ('：' + d.message) : '';
        if (status === 401) return '令牌无效或已过期（401）' + msg + '。请重新生成令牌。';
        if (status === 403) {
          if (isRateLimit(d)) return '触发 GitHub 频率限制（403）：' + quotaText() +
            '。等重置后会自动恢复，或把自动同步间隔调大。';
          return '被拒绝（403）' + msg + '。多半是令牌没勾 gist 权限（不是限流）。';
        }
        /* 注意：这段文案会被 esc() 转义后显示，所以不能用 HTML 标签，
         * 否则用户会看到 <br> 这样的字面量。用纯文本换行。 */
        if (status === 400) {
          return 'GitHub 拒绝了这次写入（400）' + msg + '。常见原因：' +
            '① 数据太大——档案图片太多，单个 Gist 文件上限约 10 MB，超了就会被拒；' +
            '请先删掉一些图片（编辑档案 → 图片上点 ✕），或用「同步链接」分批同步；' +
            '② 请求格式问题——一般重试一次就好，程序已自动重试过。';
        }
        if (status === 404) {
          // 私有 Gist 只有创建者能访问：换一个 GitHub 账号的令牌来读会是 404，
          // 不是编号填错。这里必须说清楚，否则用户会一直去找“正确的编号”
          /* 【重要修复】这里原来写的是 self.hdr()，但 err 函数里根本没有声明 self，
           * 于是 self 回退成全局的 window.self（Window 对象），
           * 调用 .hdr() 直接抛 "self.hdr is not a function" ——
           * 真正的 404 原因被这个异常盖掉，用户只看到这句莫名其妙的报错。
           * 改成显式取 PROVIDERS.gist，并包 try/catch：
           * hdr() 在没填令牌时会主动抛错，不能让它连累错误提示本身。 */
          var authz = '';
          try {
            var hh = PROVIDERS.gist.hdr();
            if (hh && hh.Authorization) authz = String(hh.Authorization);
          } catch (e) { authz = ''; }
          var mine = /ghp_|github_pat_/.test(authz);
          return '找不到这个 Gist（404）' + msg + '。可能是：编号填错 / 已被删除；' +
            '或者这个令牌属于另一个 GitHub 账号——云端空间是私有 Gist，' +
            '只有创建它的那个账号能访问，换账号的令牌一律看不到。' +
            (mine ? '' : '请先填令牌。');
        }
        return 'GitHub 返回 ' + status + msg;
      }
    },
    jsonblob: {
      label: 'jsonblob（免费匿名，推荐）',
